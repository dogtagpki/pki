name: Basic Subordinate CA
# This test will perform the following operations:
# - install root CA
# - install subordinate CA
#
# In this scenario the subordinate CA will join
# the root CA security domain.

on: workflow_call

env:
  DS_IMAGE: ${{ vars.DS_IMAGE || 'quay.io/389ds/dirsrv' }}

jobs:
  # docs/installation/ca/Installing_Subordinate_CA.md
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      SHARED: /tmp/workdir/pki
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Retrieve PKI images
        uses: actions/cache@v5
        with:
          key: pki-images-${{ github.sha }}
          path: pki-images.tar

      - name: Load PKI images
        run: docker load --input pki-images.tar

      - name: Create network
        run: docker network create example

      - name: Set up root DS container
        run: |
          tests/bin/ds-create.sh \
              --image=${{ env.DS_IMAGE }} \
              --hostname=rootds.example.com \
              --network=example \
              --network-alias=rootds.example.com \
              --password=Secret.123 \
              rootds

      - name: Set up root CA container
        run: |
          tests/bin/runner-init.sh \
              --hostname=root.example.com \
              --network=example \
              --network-alias=root.example.com \
              root

      - name: Create root CA
        run: |
          docker exec root pkispawn \
              -f /usr/share/pki/server/examples/installation/ca.cfg \
              -s CA \
              -D pki_ds_url=ldap://rootds.example.com:3389 \
              -D "pki_ca_signing_subject_dn=cn=Root CA Signing Certificate,o=EXAMPLE" \
              -v

      - name: Check root CA server status
        run: |
          docker exec root pki-server status | tee output

          # root CA should be a domain manager
          echo "True" > expected
          sed -n 's/^ *SD Manager: *\(.*\)$/\1/p' output > actual

          diff expected actual

      - name: Check root CA system certs
        run: |
          docker exec root pki-server cert-find

      - name: Install banner in root CA
        run: |
          docker exec root cp /usr/share/pki/server/examples/banner/banner.txt /var/lib/pki/pki-tomcat/conf

      - name: Install root CA admin cert
        run: |
          docker exec root pki-server cert-export \
              --cert-file $SHARED/root-ca_signing.crt \
              ca_signing

          docker exec root pki nss-cert-import \
              --cert $SHARED/root-ca_signing.crt \
              --trust CT,C,C \
              ca_signing

          docker exec root pki pkcs12-import \
              --pkcs12 /root/.dogtag/pki-tomcat/ca_admin_cert.p12 \
              --password Secret.123

          docker exec root pki \
              -n caadmin \
              --ignore-banner \
              ca-user-show \
              caadmin

      - name: Set up subordinate DS container
        run: |
          tests/bin/ds-create.sh \
              --image=${{ env.DS_IMAGE }} \
              --hostname=subds.example.com \
              --network=example \
              --network-alias=subds.example.com \
              --password=Secret.123 \
              subds

      - name: Set up subordinate CA container
        run: |
          tests/bin/runner-init.sh \
              --hostname=sub.example.com \
              --network=example \
              --network-alias=sub.example.com \
              subordinate

      - name: Create subordinate CA
        run: |
          docker exec root pki-server cert-export \
              --cert-file $SHARED/root-ca_signing.crt \
              ca_signing

          docker exec subordinate pkispawn \
              -f /usr/share/pki/server/examples/installation/subca.cfg \
              -s CA \
              -D pki_cert_chain_path=$SHARED/root-ca_signing.crt \
              -D pki_ds_url=ldap://subds.example.com:3389 \
              -D "pki_ca_signing_subject_dn=cn=Subordinate CA Signing Certificate,o=EXAMPLE" \
              -v

      - name: Check subordinate CA security domain config
        run: |
          docker exec subordinate pki-server ca-config-find | grep ^securitydomain. | sort | tee actual

          # subordinate CA should join the existing security domain in root CA
          cat > expected << EOF
          securitydomain.host=root.example.com
          securitydomain.httpport=8080
          securitydomain.httpsadminport=8443
          securitydomain.name=EXAMPLE
          securitydomain.select=existing
          EOF

          diff expected actual

      - name: Check subordinate CA server status
        run: |
          docker exec subordinate pki-server status | tee output
          sed -n 's/^ *SD Manager: *\(.*\)$/\1/p' output > actual

          # subordinate CA should not be a domain manager
          echo "False" > expected

          diff expected actual

      - name: Check subordinate CA system certs
        run: |
          docker exec subordinate pki-server cert-find

      - name: Install banner in subordinate CA
        run: |
          docker exec subordinate cp /usr/share/pki/server/examples/banner/banner.txt /var/lib/pki/pki-tomcat/conf

      - name: Check subordinate CA signing cert request
        run: |
          docker exec subordinate openssl req -text -noout \
              -in /var/lib/pki/pki-tomcat/conf/certs/ca_signing.csr \
              | tee output

          # normalize output
          # - remove hex string
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e 's/ *$//' \
              output > actual

          # TODO: investigate missing SKI extension
          cat > expected << EOF
          Certificate Request:
              Data:
                  Version: 1 (0x0)
                  Subject: O=EXAMPLE, CN=Subordinate CA Signing Certificate
                  Subject Public Key Info:
                      Public Key Algorithm: rsaEncryption
                          Public-Key: (3072 bit)
                          Exponent: 65537 (0x10001)
                  Attributes:
                      Requested Extensions:
                          X509v3 Basic Constraints: critical
                              CA:TRUE
                          X509v3 Key Usage: critical
                              Digital Signature, Non Repudiation, Certificate Sign, CRL Sign
              Signature Algorithm: sha256WithRSAEncryption
          EOF

          diff expected actual

      - name: Check subordinate CA OCSP signing cert request
        run: |
          docker exec subordinate openssl req -text -noout \
              -in /var/lib/pki/pki-tomcat/conf/certs/ca_ocsp_signing.csr \
              | tee output

          # normalize output
          # - remove hex string
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e 's/ *$//' \
              output > actual

          cat > expected << EOF
          Certificate Request:
              Data:
                  Version: 1 (0x0)
                  Subject: O=EXAMPLE, OU=pki-tomcat, CN=CA OCSP Signing Certificate
                  Subject Public Key Info:
                      Public Key Algorithm: rsaEncryption
                          Public-Key: (3072 bit)
                          Exponent: 65537 (0x10001)
                  Attributes:
                      (none)
                      Requested Extensions:
              Signature Algorithm: sha256WithRSAEncryption
          EOF

          diff expected actual

      - name: Check subordinate CA audit signing cert request
        run: |
          docker exec subordinate openssl req -text -noout \
              -in /var/lib/pki/pki-tomcat/conf/certs/ca_audit_signing.csr \
              | tee output

          # normalize output
          # - remove hex string
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e 's/ *$//' \
              output > actual

          cat > expected << EOF
          Certificate Request:
              Data:
                  Version: 1 (0x0)
                  Subject: O=EXAMPLE, OU=pki-tomcat, CN=CA Audit Signing Certificate
                  Subject Public Key Info:
                      Public Key Algorithm: rsaEncryption
                          Public-Key: (2048 bit)
                          Exponent: 65537 (0x10001)
                  Attributes:
                      (none)
                      Requested Extensions:
              Signature Algorithm: sha256WithRSAEncryption
          EOF

          diff expected actual

      - name: Check subordinate CA subsystem cert request
        run: |
          docker exec subordinate openssl req -text -noout \
              -in /var/lib/pki/pki-tomcat/conf/certs/subsystem.csr \
              | tee output

          # normalize output
          # - remove hex string
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e 's/ *$//' \
              output > actual

          cat > expected << EOF
          Certificate Request:
              Data:
                  Version: 1 (0x0)
                  Subject: O=EXAMPLE, OU=pki-tomcat, CN=Subsystem Certificate
                  Subject Public Key Info:
                      Public Key Algorithm: rsaEncryption
                          Public-Key: (2048 bit)
                          Exponent: 65537 (0x10001)
                  Attributes:
                      (none)
                      Requested Extensions:
              Signature Algorithm: sha256WithRSAEncryption
          EOF

          diff expected actual

      - name: Check subordinate CA SSL server cert request
        run: |
          docker exec subordinate openssl req -text -noout \
              -in /var/lib/pki/pki-tomcat/conf/certs/sslserver.csr \
              | tee output

          # normalize output
          # - remove hex string
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e 's/ *$//' \
              output > actual

          cat > expected << EOF
          Certificate Request:
              Data:
                  Version: 1 (0x0)
                  Subject: O=EXAMPLE, OU=pki-tomcat, CN=sub.example.com
                  Subject Public Key Info:
                      Public Key Algorithm: rsaEncryption
                          Public-Key: (2048 bit)
                          Exponent: 65537 (0x10001)
                  Attributes:
                      (none)
                      Requested Extensions:
              Signature Algorithm: sha256WithRSAEncryption
          EOF

          diff expected actual

      - name: Check subordinate CA admin cert request
        run: |
          docker exec subordinate openssl req -text -noout \
              -in /var/lib/pki/pki-tomcat/conf/certs/ca_admin.csr \
              | tee output

          # normalize output
          # - remove hex string
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e 's/ *$//' \
              output > actual

          cat > expected << EOF
          Certificate Request:
              Data:
                  Version: 1 (0x0)
                  Subject: O=EXAMPLE, OU=pki-tomcat, emailAddress=caadmin@example.com, CN=PKI Administrator
                  Subject Public Key Info:
                      Public Key Algorithm: rsaEncryption
                          Public-Key: (2048 bit)
                          Exponent: 65537 (0x10001)
                  Attributes:
                      (none)
                      Requested Extensions:
              Signature Algorithm: sha256WithRSAEncryption
          EOF

          diff expected actual

      - name: Check subordinate CA signing cert
        run: |
          docker exec subordinate pki-server cert-export \
              --cert-file ca_signing.crt \
              ca_signing

          docker exec subordinate openssl x509 -text -noout \
              -in ca_signing.crt \
              | tee output

          # normalize output
          # - remove hex string
          # - remove date and time
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Serial Number:$/d' \
              -e '/^ *Validity$/d' \
              -e '/^ *Not Before:/d' \
              -e '/^ *Not After :/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e '/^$/d' \
              -e 's/ *$//' \
              output > actual

          # the cert should not include MS extension
          # TODO: confirm that this is the correct behavior
          cat > expected << EOF
          Certificate:
              Data:
                  Version: 3 (0x2)
                  Signature Algorithm: sha256WithRSAEncryption
                  Issuer: O=EXAMPLE, CN=Root CA Signing Certificate
                  Subject: O=EXAMPLE, CN=Subordinate CA Signing Certificate
                  Subject Public Key Info:
                      Public Key Algorithm: rsaEncryption
                          Public-Key: (3072 bit)
                          Exponent: 65537 (0x10001)
                  X509v3 extensions:
                      X509v3 Subject Key Identifier:
                      X509v3 Authority Key Identifier:
                      X509v3 Basic Constraints: critical
                          CA:TRUE
                      X509v3 Key Usage: critical
                          Digital Signature, Non Repudiation, Certificate Sign, CRL Sign
                      Authority Information Access:
                          OCSP - URI:http://root.example.com:8080/ca/ocsp
              Signature Algorithm: sha256WithRSAEncryption
          EOF

          diff expected actual

      - name: Check subordinate CA OCSP signing cert
        run: |
          docker exec subordinate pki-server cert-export \
              --cert-file ca_ocsp_signing.crt \
              ca_ocsp_signing

          docker exec subordinate openssl x509 -text -noout \
              -in ca_ocsp_signing.crt \
              | tee output

          # normalize output
          # - remove hex string
          # - remove date and time
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Serial Number:$/d' \
              -e '/^ *Validity$/d' \
              -e '/^ *Not Before:/d' \
              -e '/^ *Not After :/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e '/^$/d' \
              -e 's/ *$//' \
              output > actual

          cat > expected << EOF
          Certificate:
              Data:
                  Version: 3 (0x2)
                  Signature Algorithm: sha256WithRSAEncryption
                  Issuer: O=EXAMPLE, CN=Subordinate CA Signing Certificate
                  Subject: O=EXAMPLE, OU=pki-tomcat, CN=CA OCSP Signing Certificate
                  Subject Public Key Info:
                      Public Key Algorithm: rsaEncryption
                          Public-Key: (3072 bit)
                          Exponent: 65537 (0x10001)
                  X509v3 extensions:
                      X509v3 Authority Key Identifier:
                      Authority Information Access:
                          OCSP - URI:http://sub.example.com:8080/ca/ocsp
                      X509v3 Extended Key Usage:
                          OCSP Signing
                      OCSP No Check:
              Signature Algorithm: sha256WithRSAEncryption
          EOF

          diff expected actual

      - name: Check subordinate CA audit signing cert
        run: |
          docker exec subordinate pki-server cert-export \
              --cert-file ca_audit_signing.crt \
              ca_audit_signing

          docker exec subordinate openssl x509 -text -noout \
              -in ca_audit_signing.crt \
              | tee output

          # normalize output
          # - remove hex string
          # - remove date and time
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Serial Number:$/d' \
              -e '/^ *Validity$/d' \
              -e '/^ *Not Before:/d' \
              -e '/^ *Not After :/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e '/^$/d' \
              -e 's/ *$//' \
              output > actual

          cat > expected << EOF
          Certificate:
              Data:
                  Version: 3 (0x2)
                  Signature Algorithm: sha256WithRSAEncryption
                  Issuer: O=EXAMPLE, CN=Subordinate CA Signing Certificate
                  Subject: O=EXAMPLE, OU=pki-tomcat, CN=CA Audit Signing Certificate
                  Subject Public Key Info:
                      Public Key Algorithm: rsaEncryption
                          Public-Key: (2048 bit)
                          Exponent: 65537 (0x10001)
                  X509v3 extensions:
                      X509v3 Authority Key Identifier:
                      X509v3 Key Usage: critical
                          Digital Signature, Non Repudiation
                      Authority Information Access:
                          OCSP - URI:http://sub.example.com:8080/ca/ocsp
              Signature Algorithm: sha256WithRSAEncryption
          EOF

          diff expected actual

      - name: Check subordinate CA subsystem cert
        run: |
          docker exec subordinate pki-server cert-export \
              --cert-file subsystem.crt \
              subsystem

          docker exec subordinate openssl x509 -text -noout \
              -in subsystem.crt \
              | tee output

          # normalize output
          # - remove hex string
          # - remove date and time
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Serial Number:$/d' \
              -e '/^ *Validity$/d' \
              -e '/^ *Not Before:/d' \
              -e '/^ *Not After :/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e '/^$/d' \
              -e 's/ *$//' \
              output > actual

          # subsystem cert should be issued by root CA
          # TODO: investigate missing Non Repudiation key usage
          cat > expected << EOF
          Certificate:
              Data:
                  Version: 3 (0x2)
                  Signature Algorithm: sha256WithRSAEncryption
                  Issuer: O=EXAMPLE, CN=Root CA Signing Certificate
                  Subject: O=EXAMPLE, OU=pki-tomcat, CN=Subsystem Certificate
                  Subject Public Key Info:
                      Public Key Algorithm: rsaEncryption
                          Public-Key: (2048 bit)
                          Exponent: 65537 (0x10001)
                  X509v3 extensions:
                      X509v3 Authority Key Identifier:
                      Authority Information Access:
                          OCSP - URI:http://root.example.com:8080/ca/ocsp
                      X509v3 Key Usage: critical
                          Digital Signature, Key Encipherment, Data Encipherment
                      X509v3 Extended Key Usage:
                          TLS Web Client Authentication
              Signature Algorithm: sha256WithRSAEncryption
          EOF

          diff expected actual

      - name: Check subordinate CA SSL server cert
        run: |
          docker exec subordinate pki-server cert-export \
              --cert-file sslserver.crt \
              sslserver

          docker exec subordinate openssl x509 -text -noout \
              -in sslserver.crt \
              | tee output

          # normalize output
          # - remove hex string
          # - remove date and time
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Serial Number:$/d' \
              -e '/^ *Validity$/d' \
              -e '/^ *Not Before:/d' \
              -e '/^ *Not After :/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e '/^$/d' \
              -e 's/ *$//' \
              output > actual

          # TODO: investigate inconsistent extra Key Encipherment and Data Encipherment key usages
          cat > expected << EOF
          Certificate:
              Data:
                  Version: 3 (0x2)
                  Signature Algorithm: sha256WithRSAEncryption
                  Issuer: O=EXAMPLE, CN=Subordinate CA Signing Certificate
                  Subject: O=EXAMPLE, OU=pki-tomcat, CN=sub.example.com
                  Subject Public Key Info:
                      Public Key Algorithm: rsaEncryption
                          Public-Key: (2048 bit)
                          Exponent: 65537 (0x10001)
                  X509v3 extensions:
                      X509v3 Authority Key Identifier:
                      Authority Information Access:
                          OCSP - URI:http://sub.example.com:8080/ca/ocsp
                      X509v3 Key Usage: critical
                          Digital Signature, Key Encipherment, Data Encipherment
                      X509v3 Extended Key Usage:
                          TLS Web Server Authentication
                      X509v3 Subject Alternative Name:
                          DNS:sub.example.com
              Signature Algorithm: sha256WithRSAEncryption
          EOF

          diff expected actual

      - name: Check subordinate CA admin cert
        run: |
          docker exec subordinate openssl x509 -text -noout \
              -in /root/.dogtag/pki-tomcat/ca_admin.cert \
              | tee output

          # normalize output
          # - remove hex string
          # - remove date and time
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Serial Number:$/d' \
              -e '/^ *Validity$/d' \
              -e '/^ *Not Before:/d' \
              -e '/^ *Not After :/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e '/^$/d' \
              -e 's/ *$//' \
              output > actual

          # TODO: investigate extra Key Encipherment key usage
          cat > expected << EOF
          Certificate:
              Data:
                  Version: 3 (0x2)
                  Signature Algorithm: sha256WithRSAEncryption
                  Issuer: O=EXAMPLE, CN=Subordinate CA Signing Certificate
                  Subject: O=EXAMPLE, OU=pki-tomcat, emailAddress=caadmin@example.com, CN=PKI Administrator
                  Subject Public Key Info:
                      Public Key Algorithm: rsaEncryption
                          Public-Key: (2048 bit)
                          Exponent: 65537 (0x10001)
                  X509v3 extensions:
                      X509v3 Authority Key Identifier:
                      Authority Information Access:
                          OCSP - URI:http://sub.example.com:8080/ca/ocsp
                      X509v3 Key Usage: critical
                          Digital Signature, Non Repudiation, Key Encipherment
                      X509v3 Extended Key Usage:
                          TLS Web Client Authentication, E-mail Protection
              Signature Algorithm: sha256WithRSAEncryption
          EOF

          diff expected actual

      - name: Run PKI healthcheck
        run: |
          docker exec subordinate pki-healthcheck \
              --failures-only \
              --debug \
              > >(tee stdout) 2> >(tee stderr >&2)

      - name: Check external commands
        if: always()
        run: |
          sed -n '/^Command:/p' stderr | tee output
          wc -l output

      - name: Install subordinate CA admin cert
        run: |
          docker exec subordinate pki nss-cert-import \
              --cert $SHARED/root-ca_signing.crt \
              --trust CT,C,C \
              root-ca_signing

          docker exec subordinate pki nss-cert-import \
              --cert ca_signing.crt \
              ca_signing

          docker exec subordinate pki pkcs12-import \
              --pkcs12 /root/.dogtag/pki-tomcat/ca_admin_cert.p12 \
              --password Secret.123

          docker exec subordinate pki \
              -n caadmin \
              --ignore-banner \
              ca-user-show \
              caadmin

      - name: Validate subordinate CA signing cert in server NSS database
        run: |
          docker exec subordinate /usr/lib64/nss/unsupported-tools/vfychain \
              -v \
              -d /etc/pki/pki-tomcat/alias \
              -w Secret.123 \
              -u 11 \
              -a \
              -p -p \
              -g leaf \
              -h requireFreshInfo \
              -m ocsp \
              -s failIfNoInfo \
              ca_signing.crt \
              > >(tee stdout) 2> >(tee stderr >&2)

          cat > expected << EOF
          Root Certificate Subject:: "CN=Root CA Signing Certificate,O=EXAMPLE"
          Certificate 1 Subject: "CN=Subordinate CA Signing Certificate,O=EXAMPLE"
          EOF

          diff expected stdout

          cat > expected << EOF
          Chain is good!
          EOF

          diff expected stderr

      - name: Validate subordinate CA signing cert in client NSS database
        run: |
          docker exec subordinate /usr/lib64/nss/unsupported-tools/vfychain \
              -v \
              -d /root/.dogtag/nssdb \
              -u 11 \
              -a \
              -p -p \
              -g leaf \
              -h requireFreshInfo \
              -m ocsp \
              -s failIfNoInfo \
              ca_signing.crt \
              > >(tee stdout) 2> >(tee stderr >&2)

          cat > expected << EOF
          Root Certificate Subject:: "CN=Root CA Signing Certificate,O=EXAMPLE"
          Certificate 1 Subject: "CN=Subordinate CA Signing Certificate,O=EXAMPLE"
          EOF

          diff expected stdout

          cat > expected << EOF
          Chain is good!
          EOF

          diff expected stderr

      - name: Check hosts in root CA security domain
        run: |
          docker exec root pki \
              --ignore-banner \
              securitydomain-show \
              | tee output

          # root CA security domain should contain both hosts
          cat > expected << EOF
            Domain: EXAMPLE

            CA Subsystem:

              Host ID: CA root.example.com 8443
              Hostname: root.example.com
              Port: 8080
              Secure Port: 8443
              Domain Manager: TRUE

              Host ID: CA sub.example.com 8443
              Hostname: sub.example.com
              Port: 8080
              Secure Port: 8443
              Domain Manager: FALSE

          EOF

          diff expected output

      - name: Check hosts in subordinate CA security domain
        run: |
          docker exec subordinate pki \
              --ignore-banner \
              securitydomain-show \
              > >(tee stdout) 2> >(tee stderr >&2) \
              || true

          # subordinate CA security domain should not exist
          cat > expected << EOF
          ResourceNotFoundException: Security domain not available
          EOF

          diff expected stderr

      - name: Check cert requests in subordinate CA
        run: |
          docker exec subordinate pki \
              -n caadmin \
              --ignore-banner \
              ca-cert-request-find

      - name: Check certs in subordinate CA
        run: |
          docker exec subordinate pki \
              -n caadmin \
              --ignore-banner \
              ca-cert-find

      - name: Remove subordinate CA
        run: |
          docker exec subordinate pkidestroy -s CA -v

      - name: Remove root CA
        run: |
          docker exec root pkidestroy -s CA -v

      - name: Check subordinate DS systemd journal
        if: always()
        run: |
          docker exec subds journalctl -x --no-pager -u dirsrv@localhost.service

      - name: Check subordinate DS container logs
        if: always()
