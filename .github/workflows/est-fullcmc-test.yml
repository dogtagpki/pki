name: EST fullcmc

on: workflow_call

env:
  DS_IMAGE: ${{ vars.DS_IMAGE || 'quay.io/389ds/dirsrv' }}

jobs:
  # Test EST fullcmc endpoint with client certificate identity validation
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      SHARED: /tmp/workdir/pki
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Retrieve PKI images
        uses: actions/cache@v5
        with:
          key: pki-images-${{ github.sha }}
          path: pki-images.tar

      - name: Load PKI images
        run: docker load --input pki-images.tar

      - name: Create network
        run: docker network create example

      - name: Set up DS container
        run: |
          tests/bin/ds-create.sh \
              --image=${{ env.DS_IMAGE }} \
              --hostname=ds.example.com \
              --password=Secret.123 \
              --network=example \
              --network-alias=ds.example.com \
              ds

      - name: Set up PKI container
        run: |
          tests/bin/runner-init.sh \
          --hostname=pki.example.com \
          --network=example \
          --network-alias=pki.example.com \
          pki

      - name: Get Fedora version
        run: |
          FEDORA_VERSION=$(docker exec pki sed -n 's/^VERSION_ID=//p' /etc/os-release)
          echo "FEDORA_VERSION=$FEDORA_VERSION" | tee -a $GITHUB_ENV

      - name: Get Tomcat flavor
        run: |
          TOMCAT_FLAVOR=$(docker exec pki test -f /usr/libexec/tomcat/tomcat-run.sh && echo "new" || echo "old")
          echo "TOMCAT_FLAVOR=$TOMCAT_FLAVOR" | tee -a $GITHUB_ENV

      - name: Install CA
        run: |
          docker exec pki pkispawn \
              -f /usr/share/pki/server/examples/installation/ca.cfg \
              -s CA \
              -D pki_ds_url=ldap://ds.example.com:3389 \
              -v

      - name: Initialize PKI client
        run: |
          docker exec pki pki-server cert-export ca_signing --cert-file ca_signing.crt

          docker exec pki pki nss-cert-import \
              --cert ca_signing.crt \
              --trust CT,C,C \
              ca_signing

          docker exec pki pki pkcs12-import \
              --pkcs12 /root/.dogtag/pki-tomcat/ca_admin_cert.p12 \
              --password Secret.123

          docker exec pki pki info

      - name: Set up EST user DB
        run: |
          docker exec -i pki ldapadd -x -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager"  -w Secret.123 \
              -f /usr/share/pki/est/conf/realm/ds/create.ldif

      - name: Install EST
        run: |
          docker exec pki pkispawn \
              -f /usr/share/pki/server/examples/installation/est.cfg \
              -s EST \
              -D est_realm_url=ldap://ds.example.com:3389 \
              -v

      - name: Check EST backend config
        if: always()
        run: |
          docker exec pki cat /etc/pki/pki-tomcat/est/backend.conf

      - name: Check EST authorizer config
        if: always()
        run: |
          docker exec pki cat /etc/pki/pki-tomcat/est/authorizer.conf

      - name: Check EST realm config
        if: always()
        run: |
          docker exec pki cat /etc/pki/pki-tomcat/est/realm.conf

      - name: Check webapps
        run: |
          docker exec pki pki-server webapp-find | tee output

          # CA instance should have ROOT, ca, est, and pki webapps
          echo "ROOT" > expected
          echo "ca" >> expected
          echo "est" >> expected
          echo "pki" >> expected
          sed -n 's/^ *Webapp ID: *\(.*\)$/\1/p' output > actual
          diff expected actual

      - name: Create EST test user
        run: |
          docker exec -i pki ldapadd -x -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager" -w Secret.123 << EOF
          dn: uid=est-test-user,ou=people,dc=est,dc=pki,dc=example,dc=com
          objectClass: top
          objectClass: person
          objectClass: organizationalPerson
          objectClass: inetOrgPerson
          objectClass: cmsuser
          uid: est-test-user
          sn: test.example.com
          cn: test.example.com
          usertype: undefined
          userPassword: Secret.123
          EOF

      - name: Add EST user to EST Users group
        run: |
          docker exec -i pki ldapmodify -x -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager"  -w Secret.123 << EOF
          dn: cn=EST Users,ou=groups,dc=est,dc=pki,dc=example,dc=com
          changetype: modify
          add: uniqueMember
          uniqueMember: uid=est-test-user,ou=People,dc=est,dc=pki,dc=example,dc=com
          EOF

      - name: Issue certificate for EST test user
        run: |
          # Generate key and CSR with OpenSSL
          docker exec pki openssl req -newkey rsa:2048 -nodes \
              -keyout $SHARED/est-test-user.key \
              -out $SHARED/est-test-user.csr \
              -subj "/UID=est-test-user/CN=test.example.com"

          # Submit cert request to CA
          docker exec pki pki \
              -n caadmin \
              ca-cert-request-submit \
              --profile caUserCert \
              --csr-file $SHARED/est-test-user.csr | tee output

          REQUEST_ID=$(sed -n 's/^ *Request ID: *\(.*\)$/\1/p' output)
          echo "REQUEST_ID: $REQUEST_ID"

          # Approve cert request
          docker exec pki pki \
              -n caadmin \
              ca-cert-request-approve \
              --force \
              $REQUEST_ID | tee output

          CERT_ID=$(sed -n 's/^ *Certificate ID: *\(.*\)$/\1/p' output)
          echo "CERT_ID: $CERT_ID"

          # Export signed certificate
          docker exec pki pki ca-cert-export $CERT_ID --output-file $SHARED/est-test-user.crt

          # Create NSS DB and import cert for CMCRequest signing
          docker exec pki bash -c "mkdir -p $SHARED/nssdb-testuser"
          docker exec pki bash -c "echo Secret.123 > $SHARED/nssdb-testuser/password.txt"
          docker exec pki certutil -N -d $SHARED/nssdb-testuser -f $SHARED/nssdb-testuser/password.txt

          # Import CA cert into NSS DB
          docker exec pki certutil -A -d $SHARED/nssdb-testuser -n "CA Signing" \
              -t "CT,C,C" -i ca_signing.crt -f $SHARED/nssdb-testuser/password.txt

          # Convert to PKCS12 and import into NSS DB
          docker exec pki openssl pkcs12 -export \
              -in $SHARED/est-test-user.crt \
              -inkey $SHARED/est-test-user.key \
              -out $SHARED/est-test-user.p12 \
              -name "est-test-user" \
              -passout pass:Secret.123

          docker exec pki pk12util \
              -i $SHARED/est-test-user.p12 \
              -d $SHARED/nssdb-testuser \
              -K Secret.123 \
              -W Secret.123

      - name: Add EST user certificate to LDAP
        run: |
          # Create temporary NSS database for extracting certificate details (matches guide approach)
          docker exec pki bash -c "mkdir -p $SHARED/nssdb-temp"
          docker exec pki bash -c "echo Secret.123 > $SHARED/nssdb-temp/password.txt"
          docker exec pki certutil -N -d $SHARED/nssdb-temp -f $SHARED/nssdb-temp/password.txt

          # Import certificate into temporary NSS database
          docker exec pki certutil -A -d $SHARED/nssdb-temp -n "est-test-user" \
              -t ",," -i $SHARED/est-test-user.crt -f $SHARED/nssdb-temp/password.txt

          # Get certificate details using certutil for correct formatting
          CERT_SERIAL_HEX=$(docker exec pki certutil -L -d $SHARED/nssdb-temp -n "est-test-user" | \
              grep -A1 "Serial Number:" | tail -1 | tr -d ' :' | tr -d '\n')
          CERT_SERIAL_DEC=$(python3 -c "print(int('$CERT_SERIAL_HEX', 16))")

          CERT_ISSUER=$(docker exec pki certutil -L -d $SHARED/nssdb-temp -n "est-test-user" | \
              grep "Issuer:" | sed 's/.*Issuer: "\(.*\)"/\1/')

          CERT_SUBJECT=$(docker exec pki certutil -L -d $SHARED/nssdb-temp -n "est-test-user" | \
              grep "Subject:" | sed 's/.*Subject: "\(.*\)"/\1/')

          # Convert certificate to DER and base64
          docker exec pki openssl x509 -in $SHARED/est-test-user.crt -outform DER -out $SHARED/est-test-user.der
          CERT_B64=$(docker exec pki base64 -w 0 $SHARED/est-test-user.der)

          # Clean up temporary NSS database
          docker exec pki rm -rf $SHARED/nssdb-temp

          echo "CERT_SERIAL_DEC: $CERT_SERIAL_DEC"
          echo "CERT_ISSUER: $CERT_ISSUER"
          echo "CERT_SUBJECT: $CERT_SUBJECT"

          # Update LDAP entry with certificate
          docker exec -i pki ldapmodify -x -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager" -w Secret.123 << EOF
          dn: uid=est-test-user,ou=people,dc=est,dc=pki,dc=example,dc=com
          changetype: modify
          add: description
          description: 2;$CERT_SERIAL_DEC;$CERT_ISSUER;$CERT_SUBJECT
          -
          add: userCertificate
          userCertificate:: $CERT_B64
          EOF

      - name: Test EST fullcmc with mutual TLS (baseline)
        run: |
          # Generate RSA CSR for device cert with SAME subject as est-test-user cert
          # (RAHeaderClientCertSubjectNameConstraint requires subject match for non-agents)
          docker exec pki openssl req -new -newkey rsa:2048 -nodes \
              -keyout $SHARED/device-mtls.key \
              -out $SHARED/device-mtls.csr \
              -subj "/UID=est-test-user/CN=test.example.com"

          # Convert to DER base64
          docker exec pki openssl req -in $SHARED/device-mtls.csr -outform DER -out $SHARED/device-mtls.der
          docker exec pki openssl base64 -in $SHARED/device-mtls.der -out $SHARED/device-mtls.p10

          # Create CMC request config
          docker exec pki bash -c "cat > $SHARED/device-mtls-cmc.cfg << EOF
          dbdir=$SHARED/nssdb-testuser
          password=Secret.123
          tokenname=internal
          nickname=est-test-user
          format=pkcs10
          numRequests=1
          input=$SHARED/device-mtls.p10
          output=$SHARED/device-mtls-cmc.req
          EOF"

          # Generate CMC request
          docker exec pki CMCRequest $SHARED/device-mtls-cmc.cfg

          # Submit with mutual TLS
          if ! HTTP_CODE=$(docker exec pki curl -sS \
              --cacert ca_signing.crt \
              --cert $SHARED/est-test-user.crt \
              --key $SHARED/est-test-user.key \
              -H "Content-Type: application/pkcs7-mime; smime-type=CMC-request" \
              --data-binary @$SHARED/device-mtls-cmc.req \
              https://pki.example.com:8443/.well-known/est/fullcmc \
              -o $SHARED/device-mtls-response.b64 \
              -w '%{http_code}'); then
            echo "ERROR: curl failed"
            exit 1
          fi
          echo "HTTP_CODE: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: expected successful enrollment with HTTP 200"
            exit 1
          fi

          # PRIMARY VALIDATION: Verify certificate was actually issued
          docker exec pki pki ca-cert-find --name "test.example.com" --status VALID > baseline-cert-output
          cat baseline-cert-output

          # Should find the certificate
          if ! grep -q "test.example.com" baseline-cert-output; then
            echo "ERROR: Certificate was not issued for legitimate request!"
            exit 1
          fi

          echo "PASS: Certificate successfully issued for legitimate request"

          # SECONDARY: Verify CMC response indicates success
          docker exec pki CMCResponse -d $SHARED/nssdb-testuser -i $SHARED/device-mtls-response.b64 | tee output

          # Should see SUCCESS status
          echo "SUCCESS" > expected
          sed -n 's/^ *Status: *\(.*\)$/\1/p' output > actual
          diff expected actual

      - name: Get EST subsystem certificate subject DN
        run: |
          # Extract EST subsystem cert
          docker exec pki pki \
              -d /var/lib/pki/pki-tomcat/alias \
              -f /var/lib/pki/pki-tomcat/conf/password.conf \
              nss-cert-export subsystem \
              --output-file $SHARED/est-subsystem.crt

          # Check subject DN and encoding
          docker exec pki openssl x509 -in $SHARED/est-subsystem.crt -noout -subject | tee output
          echo "EST subsystem cert subject:"
          cat output

          # Verify UTF8STRING encoding
          docker exec pki openssl x509 -in $SHARED/est-subsystem.crt -outform DER -out $SHARED/est-subsystem.der
          docker exec pki openssl asn1parse -inform DER -in $SHARED/est-subsystem.der | grep UTF8STRING

      - name: Create self-signed certificate with matching subject DN
        run: |
          # Create OpenSSL config with UTF8STRING encoding to match EST subsystem cert
          docker exec pki bash -c "cat > $SHARED/alternative-cert.conf << 'EOF'
          [ req ]
          default_bits       = 2048
          distinguished_name = req_dn
          x509_extensions    = v3_req
          prompt             = no
          string_mask        = utf8only
          utf8               = yes

          [ req_dn ]
          O  = EXAMPLE
          OU = pki-est
          CN = Subsystem Certificate

          [ v3_req ]
          basicConstraints     = CA:FALSE
          keyUsage             = digitalSignature,keyEncipherment
          subjectKeyIdentifier = hash
          EOF"

          # Generate key and self-signed cert with matching subject DN
          docker exec pki openssl genpkey -algorithm RSA \
              -out $SHARED/alternative-cert.key \
              -pkeyopt rsa_keygen_bits:2048

          docker exec pki openssl req -new -x509 \
              -key $SHARED/alternative-cert.key \
              -out $SHARED/alternative-cert.pem \
              -days 365 \
              -config $SHARED/alternative-cert.conf

          # Verify subject DN matches EST subsystem cert
          docker exec pki openssl x509 -in $SHARED/alternative-cert.pem -noout -subject | tee alt-subject
          docker exec pki openssl x509 -in $SHARED/est-subsystem.crt -noout -subject | tee real-subject

          echo "Alternative cert subject:"
          cat alt-subject
          echo "Real EST subsystem cert subject:"
          cat real-subject
          diff real-subject alt-subject

          # Import into NSS DB
          docker exec pki openssl pkcs12 -export \
              -in $SHARED/alternative-cert.pem \
              -inkey $SHARED/alternative-cert.key \
              -out $SHARED/alternative-cert.p12 \
              -name "alternative-cert" \
              -passout pass:Secret.123

          docker exec pki pk12util \
              -i $SHARED/alternative-cert.p12 \
              -d $SHARED/nssdb-testuser \
              -K Secret.123 \
              -W Secret.123

      - name: Test EST fullcmc with alternative certificate
        run: |
          # Generate RSA CSR with arbitrary subject
          docker exec pki openssl req -new -newkey rsa:2048 -nodes \
              -keyout $SHARED/device-alt.key \
              -out $SHARED/device-alt.csr \
              -subj "/CN=Arbitrary Device,O=DIFFERENT ORG,C=US"

          # Convert to DER base64
          docker exec pki openssl req -in $SHARED/device-alt.csr -outform DER -out $SHARED/device-alt.der
          docker exec pki openssl base64 -in $SHARED/device-alt.der -out $SHARED/device-alt.p10

          # Create CMC request signed with alternative cert
          docker exec pki bash -c "cat > $SHARED/device-alt-cmc.cfg << EOF
          dbdir=$SHARED/nssdb-testuser
          password=Secret.123
          tokenname=internal
          nickname=alternative-cert
          format=pkcs10
          numRequests=1
          input=$SHARED/device-alt.p10
          output=$SHARED/device-alt-cmc.req
          EOF"

          # Generate CMC request
          docker exec pki CMCRequest $SHARED/device-alt-cmc.cfg

          # Submit with BasicAuth (no client cert)
          if ! HTTP_CODE=$(docker exec pki curl -sS \
              --cacert ca_signing.crt \
              -u est-test-user:Secret.123 \
              -H "Content-Type: application/pkcs7-mime; smime-type=CMC-request" \
              --data-binary @$SHARED/device-alt-cmc.req \
              https://pki.example.com:8443/.well-known/est/fullcmc \
              -o $SHARED/device-alt-response.b64 \
              -w '%{http_code}'); then
            echo "ERROR: curl failed"
            exit 1
          fi
          echo "HTTP_CODE: $HTTP_CODE"
          if [ "$HTTP_CODE" != "400" ]; then
            echo "ERROR: expected CMC rejection with HTTP 400"
            exit 1
          fi

          # PRIMARY VALIDATION: Check if arbitrary certificate was issued
          # Search for any certs issued to the arbitrary subject
          docker exec pki pki ca-cert-find --name "Arbitrary Device" --status VALID > cert-find-output
          cat cert-find-output

          # Should find NO certificates with arbitrary subject
          if grep -q "Arbitrary Device" cert-find-output; then
            echo "ERROR: Certificate was issued with arbitrary subject!"
            echo "Security bug exists - arbitrary certificate issuance is possible!"
            exit 1
          fi

          echo "PASS: No arbitrary certificates found - validation working correctly"

          # SECONDARY: Try to parse CMC response (informational only, unreliable)
          docker exec pki CMCResponse -d $SHARED/nssdb-testuser -i $SHARED/device-alt-response.b64 2>&1 | tee cmc-response-output || true

          if grep -q "SUCCESS" cmc-response-output; then
            echo "WARNING: CMCResponse shows SUCCESS but no cert was issued (unexpected response)"
          fi

      - name: Check CA debug log
        if: always()
        run: |
          docker exec pki find /var/lib/pki/pki-tomcat/logs/ca -name "debug.*" -exec cat {} \;

      - name: Gather artifacts
        if: always()
        run: |
          mkdir -p est-fullcmc-test
          docker cp pki:$SHARED/. est-fullcmc-test/ || true
          docker exec pki find /var/lib/pki/pki-tomcat/logs/ca -name "debug.*" -exec cat {} \; > est-fullcmc-test/ca-debug.log 2>&1 || true
          docker exec pki find /var/lib/pki/pki-tomcat/logs/est -name "debug.*" -exec cat {} \; > est-fullcmc-test/est-debug.log 2>&1 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: est-fullcmc-test
          path: est-fullcmc-test

      - name: Remove network
        run: docker network rm example
