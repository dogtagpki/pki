          AUTHZ \$NonRoleUser\$ certServer.ee.request.ocsp submit
          ACCESS_SESSION_ESTABLISH "UID=auditor"
          AUTH auditor certUserDBAuthMgr
          AUTHZ auditor certServer.ca.account login
          ROLE_ASSUME auditor "Auditors"
          AUTHZ auditor certServer.log.content.signedAudit read
