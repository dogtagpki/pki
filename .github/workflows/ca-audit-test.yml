name: CA audit
# This test will perform the following operations:
# - install CA
# - check default audit config
# - check default audit events
# - check initial audit logs
# - check admin user
# - create auditor user
# - add auditor user to Auditors group
# - create auditor password
# - create auditor cert
# - assign auditor cert to auditor user
# - check audit log files with username/password
# - check audit log files with client cert
# - export audit log files
# - check exported audit log files
# - check audit log signatures
# - remove CA
#
# The NEW_LOGS and TOTAL_LOGS variables are used to get
# the audit logs generated by each operation so they
# can be verified.
#
# Currently each ACCESS_SESSION_ESTABLISH event has two
# ACCESS_SESSION_TERMINATED events. This needs further
# investigation.

on: workflow_call

env:
  DS_IMAGE: ${{ vars.DS_IMAGE || 'quay.io/389ds/dirsrv' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      SHARED: /tmp/workdir/pki
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Retrieve PKI images
        uses: actions/cache@v5
        with:
          key: pki-images-${{ github.sha }}
          path: pki-images.tar

      - name: Load PKI images
        run: docker load --input pki-images.tar

      - name: Create network
        run: docker network create example

      - name: Set up DS container
        run: |
          tests/bin/ds-create.sh \
              --image=${{ env.DS_IMAGE }} \
              --hostname=ds.example.com \
              --network=example \
              --network-alias=ds.example.com \
              --password=Secret.123 \
              ds

      - name: Set up PKI container
        run: |
          tests/bin/runner-init.sh \
              --hostname=pki.example.com \
              --network=example \
              --network-alias=pki.example.com \
              pki

      - name: Install CA
        run: |
          # docs/installation/ca/installing-ca.adoc

          docker exec pki pkispawn \
              -f /usr/share/pki/server/examples/installation/ca.cfg \
              -s CA \
              -D pki_ds_url=ldap://ds.example.com:3389 \
              -v

      - name: Check default audit config
        run: |
          # https://github.com/dogtagpki/pki/wiki/Configuring-Audit

          docker exec pki pki-server ca-config-find \
              | sed -n \
                  -e '/^ca\.audit_signing\..*=/p' \
                  -e '/^ca\.cert\.audit_signing\..*=/p' \
                  -e '/^ca\.cert\.list=/p' \
              | tee output

          cat > expected << EOF
          ca.audit_signing.defaultSigningAlgorithm=SHA256withRSA
          ca.audit_signing.nickname=ca_audit_signing
          ca.audit_signing.tokenname=internal
          ca.cert.audit_signing.certusage=ObjectSigner
          ca.cert.audit_signing.nickname=ca_audit_signing
          ca.cert.list=signing,ocsp_signing,sslserver,subsystem,audit_signing
          EOF

          diff expected output

          docker exec pki pki-server ca-audit-config-show | tee output

          cat > expected << EOF
            Enabled: True
            Log File: /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit
            Buffer Size (bytes): 512
            Flush Interval (seconds): 5
            Max File Size (bytes): 2000
            Rollover Interval (seconds): 2592000
            Expiration Time (seconds): 0
            Log Signing: False
            Signing Certificate: ca_audit_signing
          EOF

          diff expected output

      - name: Check default audit events
        run: |
          # https://github.com/dogtagpki/pki/wiki/PKI-Server-Audit-CLI

          docker exec pki pki-server ca-audit-event-find | tee output

          cat > expected << EOF
          ------------------
          57 entries matched
          ------------------
            Event Name: ACCESS_SESSION_ESTABLISH
            Enabled: True
            Filter: None

            Event Name: ACCESS_SESSION_TERMINATED
            Enabled: True
            Filter: None

            Event Name: AUDIT_LOG_DELETE
            Enabled: False
            Filter: None

            Event Name: AUDIT_LOG_SHUTDOWN
            Enabled: False
            Filter: None

            Event Name: AUDIT_LOG_SIGNING
            Enabled: True
            Filter: None

            Event Name: AUDIT_LOG_STARTUP
            Enabled: True
            Filter: None

            Event Name: AUTH
            Enabled: True
            Filter: None

            Event Name: AUTHORITY_CONFIG
            Enabled: True
            Filter: None

            Event Name: AUTHZ
            Enabled: True
            Filter: None

            Event Name: CERT_PROFILE_APPROVAL
            Enabled: True
            Filter: None

            Event Name: CERT_REQUEST_PROCESSED
            Enabled: True
            Filter: None

            Event Name: CERT_SIGNING_INFO
            Enabled: True
            Filter: None

            Event Name: CERT_STATUS_CHANGE_REQUEST
            Enabled: True
            Filter: None

            Event Name: CERT_STATUS_CHANGE_REQUEST_PROCESSED
            Enabled: True
            Filter: None

            Event Name: CIMC_CERT_VERIFICATION
            Enabled: False
            Filter: None

            Event Name: CLIENT_ACCESS_SESSION_ESTABLISH
            Enabled: True
            Filter: None

            Event Name: CLIENT_ACCESS_SESSION_TERMINATED
            Enabled: True
            Filter: None

            Event Name: CMC_ID_POP_LINK_WITNESS
            Enabled: False
            Filter: None

            Event Name: CMC_PROOF_OF_IDENTIFICATION
            Enabled: False
            Filter: None

            Event Name: CMC_REQUEST_RECEIVED
            Enabled: True
            Filter: None

            Event Name: CMC_RESPONSE_SENT
            Enabled: True
            Filter: None

            Event Name: CMC_SIGNED_REQUEST_SIG_VERIFY
            Enabled: True
            Filter: (Outcome=Failure)

            Event Name: CMC_USER_SIGNED_REQUEST_SIG_VERIFY
            Enabled: True
            Filter: (Outcome=Failure)

            Event Name: CONFIG_ACL
            Enabled: True
            Filter: None

            Event Name: CONFIG_AUTH
            Enabled: True
            Filter: None

            Event Name: CONFIG_CERT_POLICY
            Enabled: False
            Filter: None

            Event Name: CONFIG_CERT_PROFILE
            Enabled: True
            Filter: None

            Event Name: CONFIG_CRL_PROFILE
            Enabled: True
            Filter: None

            Event Name: CONFIG_ENCRYPTION
            Enabled: True
            Filter: None

            Event Name: CONFIG_ROLE
            Enabled: True
            Filter: None

            Event Name: CONFIG_SERIAL_NUMBER
            Enabled: True
            Filter: None

            Event Name: CONFIG_SIGNED_AUDIT
            Enabled: True
            Filter: None

            Event Name: CONFIG_TRUSTED_PUBLIC_KEY
            Enabled: True
            Filter: None

            Event Name: CRL_SIGNING_INFO
            Enabled: True
            Filter: None

            Event Name: DELTA_CRL_GENERATION
            Enabled: True
            Filter: (Outcome=Failure)

            Event Name: DELTA_CRL_PUBLISHING
            Enabled: False
            Filter: None

            Event Name: FULL_CRL_GENERATION
            Enabled: True
            Filter: (Outcome=Failure)

            Event Name: FULL_CRL_PUBLISHING
            Enabled: False
            Filter: None

            Event Name: INTER_BOUNDARY
            Enabled: False
            Filter: None

            Event Name: KEY_GEN_ASYMMETRIC
            Enabled: True
            Filter: None

            Event Name: KEY_RECOVERY_REQUEST
            Enabled: False
            Filter: None

            Event Name: LOG_EXPIRATION_CHANGE
            Enabled: False
            Filter: None

            Event Name: LOG_PATH_CHANGE
            Enabled: True
            Filter: None

            Event Name: NON_PROFILE_CERT_REQUEST
            Enabled: False
            Filter: None

            Event Name: OCSP_GENERATION
            Enabled: True
            Filter: (Outcome=Failure)

            Event Name: OCSP_SIGNING_INFO
            Enabled: True
            Filter: None

            Event Name: PROFILE_CERT_REQUEST
            Enabled: True
            Filter: None

            Event Name: PROOF_OF_POSSESSION
            Enabled: True
            Filter: None

            Event Name: RANDOM_GENERATION
            Enabled: True
            Filter: (Outcome=Failure)

            Event Name: ROLE_ASSUME
            Enabled: True
            Filter: None

            Event Name: SCHEDULE_CRL_GENERATION
            Enabled: True
            Filter: None

            Event Name: SECURITY_DOMAIN_UPDATE
            Enabled: True
            Filter: None

            Event Name: SELFTESTS_EXECUTION
            Enabled: True
            Filter: None

            Event Name: SERVER_SIDE_KEYGEN_ENROLL_KEYGEN_REQUEST
            Enabled: False
            Filter: None

            Event Name: SERVER_SIDE_KEYGEN_ENROLL_KEY_RETRIEVAL_REQUEST
            Enabled: False
            Filter: None

            Event Name: SERVER_SIDE_KEYGEN_REQUEST
            Enabled: True
            Filter: None

            Event Name: SERVER_SIDE_KEYGEN_REQUEST_PROCESSED
            Enabled: True
            Filter: None
          EOF

          diff expected output

      - name: Check initial audit logs
        run: |
          # https://github.com/dogtagpki/pki/wiki/Audit-Events

          # check audit log folder
          docker exec pki ls -1 /var/lib/pki/pki-tomcat/logs/ca/signedAudit | tee output

          # there should be one log file
          cat > expected << EOF
          ca_audit
          EOF

          diff expected output

          # get audit log files
          docker exec pki pki-server ca-audit-file-find | tee output

          sed -n "s/^\s*File name: \s*\(\S*\)$/\1/p" output > actual

          # there should be one log file
          cat > expected << EOF
          ca_audit
          EOF

          diff expected actual

          # get initial audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # normalize output
          # ignore SSL session events since they depend on server startup time
          sed -E \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/d' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/d' \
              -e 's/^.*\[AuditEvent=(CERT_SIGNING_INFO)\].*\[SubjectID=([^]]*)\].*$/\1 \2/' \
              -e 's/^.*\[AuditEvent=(CRL_SIGNING_INFO)\].*\[SubjectID=([^]]*)\].*$/\1 \2/' \
              -e 's/^.*\[AuditEvent=(OCSP_SIGNING_INFO)\].*\[SubjectID=([^]]*)\].*$/\1 \2/' \
              -e 's/^.*\[AuditEvent=(SELFTESTS_EXECUTION)\].*\[SubjectID=([^]]*)\].*$/\1 \2/' \
              output > actual

          cat > expected << EOF
          CERT_SIGNING_INFO \$System\$
          CRL_SIGNING_INFO \$System\$
          OCSP_SIGNING_INFO \$System\$
          SELFTESTS_EXECUTION \$System\$
          EOF

          diff expected actual

          # check SSL session events
          sed -En \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/p' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/p' \
              output > actual

          # there should be some SSL session events
          [ -s actual ]

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $NEW_LOGS > total_logs

      - name: Install admin cert
        run: |
          docker exec pki pki-server cert-export \
              --cert-file ca_signing.crt \
              ca_signing

          docker exec pki pki nss-cert-import \
              --cert ca_signing.crt \
              --trust CT,C,C \
              ca_signing

          docker exec pki pki pkcs12-import \
              --pkcs12 /root/.dogtag/pki-tomcat/ca_admin_cert.p12 \
              --password Secret.123

      - name: Check admin user
        run: |
          docker exec pki pki -n caadmin ca-user-show caadmin

          sleep 5  # wait for buffer to flush

          TOTAL_LOGS=$(cat total_logs)
          echo "TOTAL_LOGS: $TOTAL_LOGS"

          # get new audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E \
                  -e "1,${TOTAL_LOGS}d" \
                  -e 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # normalize output
          sed -E \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_ESTABLISH)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_TERMINATED)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(AUTH)\].*\[SubjectID=([^]]*)\].*\[AuthMgr=([^]]*)\].*$/\1 \2 \3/' \
              -e 's/^.*\[AuditEvent=(AUTHZ)\].*\[SubjectID=([^]]*)\].*\[aclResource=([^]]*)\].*\[Op=([^]]*)\].*$/\1 \2 \3 \4/' \
              -e 's/^.*\[AuditEvent=(ROLE_ASSUME)\].*\[SubjectID=([^]]*)\].*\[Role=([^]]*)\].*$/\1 \2 "\3"/' \
              output > actual

          cat > expected << EOF
          AUTHZ \$NonRoleUser\$ certServer.ee.request.ocsp submit
          ACCESS_SESSION_ESTABLISH "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          AUTH caadmin certUserDBAuthMgr
          AUTHZ caadmin certServer.ca.account login
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          AUTHZ caadmin certServer.ca.users execute
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          AUTHZ caadmin certServer.ca.account logout
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          ACCESS_SESSION_TERMINATED "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          ACCESS_SESSION_TERMINATED "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          EOF

          diff expected actual

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $((TOTAL_LOGS + NEW_LOGS)) > total_logs

      - name: Create auditor user
        run: |
          # https://github.com/dogtagpki/pki/wiki/Creating-Auditor

          docker exec pki pki \
              -n caadmin \
              ca-user-add \
              --full-name "Auditor" \
              auditor

          sleep 5  # wait for buffer to flush

          TOTAL_LOGS=$(cat total_logs)
          echo "TOTAL_LOGS: $TOTAL_LOGS"

          # get new audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E \
                  -e "1,${TOTAL_LOGS}d" \
                  -e 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # normalize output
          sed -E \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_ESTABLISH)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_TERMINATED)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(AUTH)\].*\[SubjectID=([^]]*)\].*\[AuthMgr=([^]]*)\].*$/\1 \2 \3/' \
              -e 's/^.*\[AuditEvent=(AUTHZ)\].*\[SubjectID=([^]]*)\].*\[aclResource=([^]]*)\].*\[Op=([^]]*)\].*$/\1 \2 \3 \4/' \
              -e 's/^.*\[AuditEvent=(ROLE_ASSUME)\].*\[SubjectID=([^]]*)\].*\[Role=([^]]*)\].*$/\1 \2 "\3"/' \
              -e 's/^.*\[AuditEvent=(CONFIG_ROLE)\].*\[SubjectID=([^]]*)\].*\[ParamNameValPairs=([^]]*)\].*$/\1 \2 \3/' \
              -e 's/^(CONFIG_ROLE .*) Scope;;([^+]*).*Operation;;([^+]*).*Resource;;([^+]*).*/\1 \2 \3 "\4"/' \
              output > actual

          cat > expected << EOF
          AUTHZ \$NonRoleUser\$ certServer.ee.request.ocsp submit
          ACCESS_SESSION_ESTABLISH "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          AUTH caadmin certUserDBAuthMgr
          AUTHZ caadmin certServer.ca.account login
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          AUTHZ caadmin certServer.ca.users execute
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          CONFIG_ROLE caadmin users OP_ADD "auditor"
          AUTHZ caadmin certServer.ca.account logout
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          ACCESS_SESSION_TERMINATED "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          ACCESS_SESSION_TERMINATED "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          EOF

          diff expected actual

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $((TOTAL_LOGS + NEW_LOGS)) > total_logs

      - name: Add auditor user to Auditors group
        run: |
          # https://github.com/dogtagpki/pki/wiki/Creating-Auditor

          docker exec pki pki \
              -n caadmin \
              ca-user-membership-add \
              auditor \
              "Auditors"

          sleep 5  # wait for buffer to flush

          TOTAL_LOGS=$(cat total_logs)
          echo "TOTAL_LOGS: $TOTAL_LOGS"

          # get new audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E \
                  -e "1,${TOTAL_LOGS}d" \
                  -e 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # normalize output
          sed -E \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_ESTABLISH)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_TERMINATED)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(AUTH)\].*\[SubjectID=([^]]*)\].*\[AuthMgr=([^]]*)\].*$/\1 \2 \3/' \
              -e 's/^.*\[AuditEvent=(AUTHZ)\].*\[SubjectID=([^]]*)\].*\[aclResource=([^]]*)\].*\[Op=([^]]*)\].*$/\1 \2 \3 \4/' \
              -e 's/^.*\[AuditEvent=(ROLE_ASSUME)\].*\[SubjectID=([^]]*)\].*\[Role=([^]]*)\].*$/\1 \2 "\3"/' \
              -e 's/^.*\[AuditEvent=(CONFIG_ROLE)\].*\[SubjectID=([^]]*)\].*\[ParamNameValPairs=([^]]*)\].*$/\1 \2 \3/' \
              -e 's/^(CONFIG_ROLE .*) Scope;;([^+]*).*Operation;;([^+]*).*Resource;;([^+]*).*/\1 \2 \3 "\4"/' \
              output > actual

          cat > expected << EOF
          AUTHZ \$NonRoleUser\$ certServer.ee.request.ocsp submit
          ACCESS_SESSION_ESTABLISH "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          AUTH caadmin certUserDBAuthMgr
          AUTHZ caadmin certServer.ca.account login
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          AUTHZ caadmin certServer.ca.users execute
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          CONFIG_ROLE caadmin members OP_ADD "Auditors"
          AUTHZ caadmin certServer.ca.account logout
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          ACCESS_SESSION_TERMINATED "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          ACCESS_SESSION_TERMINATED "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          EOF

          diff expected actual

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $((TOTAL_LOGS + NEW_LOGS)) > total_logs

      - name: Create auditor password
        run: |
          # https://github.com/dogtagpki/pki/wiki/Creating-Auditor

          docker exec pki pki \
              -n caadmin \
              ca-user-mod \
              --password Secret.123 \
              auditor

          sleep 5  # wait for buffer to flush

          TOTAL_LOGS=$(cat total_logs)
          echo "TOTAL_LOGS: $TOTAL_LOGS"

          # get new audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E \
                  -e "1,${TOTAL_LOGS}d" \
                  -e 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # normalize output
          sed -E \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_ESTABLISH)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_TERMINATED)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(AUTH)\].*\[SubjectID=([^]]*)\].*\[AuthMgr=([^]]*)\].*$/\1 \2 \3/' \
              -e 's/^.*\[AuditEvent=(AUTHZ)\].*\[SubjectID=([^]]*)\].*\[aclResource=([^]]*)\].*\[Op=([^]]*)\].*$/\1 \2 \3 \4/' \
              -e 's/^.*\[AuditEvent=(ROLE_ASSUME)\].*\[SubjectID=([^]]*)\].*\[Role=([^]]*)\].*$/\1 \2 "\3"/' \
              -e 's/^.*\[AuditEvent=(CONFIG_ROLE)\].*\[SubjectID=([^]]*)\].*\[ParamNameValPairs=([^]]*)\].*$/\1 \2 \3/' \
              -e 's/^(CONFIG_ROLE .*) Scope;;([^+]*).*Operation;;([^+]*).*Resource;;([^+]*).*/\1 \2 \3 "\4"/' \
              output > actual

          cat > expected << EOF
          AUTHZ \$NonRoleUser\$ certServer.ee.request.ocsp submit
          ACCESS_SESSION_ESTABLISH "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          AUTH caadmin certUserDBAuthMgr
          AUTHZ caadmin certServer.ca.account login
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          AUTHZ caadmin certServer.ca.users execute
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          CONFIG_ROLE caadmin users OP_MODIFY "auditor"
          AUTHZ caadmin certServer.ca.account logout
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          ACCESS_SESSION_TERMINATED "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          ACCESS_SESSION_TERMINATED "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          EOF

          diff expected actual

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $((TOTAL_LOGS + NEW_LOGS)) > total_logs

      - name: Create auditor cert
        run: |
          # https://github.com/dogtagpki/pki/wiki/Creating-Auditor

          # create cert request
          docker exec pki pki \
              nss-cert-request \
              --subject UID=auditor \
              --csr auditor.csr

          # issue cert
          docker exec pki pki \
              -n caadmin \
              ca-cert-issue \
              --profile caUserCert \
              --csr-file auditor.csr \
              --subject UID=auditor \
              --output-file auditor.crt

          sleep 5  # wait for buffer to flush

          TOTAL_LOGS=$(cat total_logs)
          echo "TOTAL_LOGS: $TOTAL_LOGS"

          # get new audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E \
                  -e "1,${TOTAL_LOGS}d" \
                  -e 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # normalize output
          sed -E \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_ESTABLISH)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
