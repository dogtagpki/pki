      - name: Check exported audit log files
        run: |
          # ideally the exported audit log file should be
          # identical to the actual audit log file stored on
          # the server, but the exported file will be shorter
          # than the actual file since after exporting the
          # file the pki ca-audit-file-retrieve will perform
          # a logout operation which will only be recorded in
          # the actual log file. so in order to compare
          # properly the actual log file needs to be trimmed
          # to match the size of the exported log file.

          # get the size of exported audit log file
          SIZE=$(stat -c '%s' ca_audit)
          echo "SIZE: $SIZE"

          # trim actual audit log file to match exported file
          docker exec pki head \
              -c $SIZE \
              /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              > expected

          diff expected ca_audit

      - name: Check valid audit log signatures
        run: |
          # https://github.com/dogtagpki/pki/wiki/Verifying-Signed-Audit-Logs

          # count log signing events
          sed -En -e '/^.*\[AuditEvent=AUDIT_LOG_SIGNING\].*$/p' ca_audit | tee output
          COUNTER=$(cat output | wc -l)
          echo "COUNTER: $COUNTER"

          # AuditVerify skips the first signature since it cannot be verified
          COUNTER=$((COUNTER - 1))
          echo $COUNTER > counter

          docker exec pki pki-server cert-export \
              --cert-file ca_audit_signing.crt \
              ca_audit_signing

          docker exec pki pki nss-cert-import \
              --cert ca_audit_signing.crt \
              --trust ,,P \
              ca_audit_signing

          cat > filenames << EOF
          $SHARED/ca_audit
          EOF

          docker exec pki AuditVerify \
              -d /root/.dogtag/nssdb \
              -n ca_audit_signing \
              -a $SHARED/filenames \
              | tee output

          # normalize output
          sed -E -e '/^$/d' output > actual

          # there should be valid signatures
          cat > expected << EOF
          Verification process complete.
          Valid signatures: $COUNTER
          Invalid signatures: 0
          EOF

          diff expected actual

      - name: Check invalid audit log signatures
        run: |
          COUNTER=$(cat counter)

          # invalidate all signatures
          sed -Ei \
              -e 's/^(.*\[AuditEvent=AUDIT_LOG_SIGNING\].* sig:) .*$/\1 XXXXX/' \
              ca_audit

          docker exec pki AuditVerify \
              -d /root/.dogtag/nssdb \
              -n ca_audit_signing \
              -a $SHARED/filenames \
              | tee output

          # normalize output
          sed \
              -e '/^$/d' \
              -e '/^Line .*: VERIFICATION FAILED:/d' \
              output > actual

          # there should be invalid signatures
          cat > expected << EOF
          ======
          File: $SHARED/ca_audit
          ======
          Verification process complete.
          Valid signatures: 0
          Invalid signatures: $COUNTER
          EOF

          diff expected actual

          # count failures
          sed -n \
              '/^Line .*: VERIFICATION FAILED:/p' \
              output \
              | wc -l \
              > actual

          diff counter actual

      - name: Remove CA
        run: |
