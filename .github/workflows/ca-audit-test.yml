            Enabled: False
            Filter: None

            Event Name: LOG_PATH_CHANGE
            Enabled: True
            Filter: None

            Event Name: NON_PROFILE_CERT_REQUEST
            Enabled: False
            Filter: None

            Event Name: OCSP_GENERATION
            Enabled: True
            Filter: (Outcome=Failure)

            Event Name: OCSP_SIGNING_INFO
            Enabled: True
            Filter: None

            Event Name: PROFILE_CERT_REQUEST
            Enabled: True
            Filter: None

            Event Name: PROOF_OF_POSSESSION
            Enabled: True
            Filter: None

            Event Name: RANDOM_GENERATION
            Enabled: True
            Filter: (Outcome=Failure)

            Event Name: ROLE_ASSUME
            Enabled: True
            Filter: None

            Event Name: SCHEDULE_CRL_GENERATION
            Enabled: True
            Filter: None

            Event Name: SECURITY_DOMAIN_UPDATE
            Enabled: True
            Filter: None

            Event Name: SELFTESTS_EXECUTION
            Enabled: True
            Filter: None

            Event Name: SERVER_SIDE_KEYGEN_ENROLL_KEYGEN_REQUEST
            Enabled: False
            Filter: None

            Event Name: SERVER_SIDE_KEYGEN_ENROLL_KEY_RETRIEVAL_REQUEST
            Enabled: False
            Filter: None

            Event Name: SERVER_SIDE_KEYGEN_REQUEST
            Enabled: True
            Filter: None

            Event Name: SERVER_SIDE_KEYGEN_REQUEST_PROCESSED
            Enabled: True
            Filter: None
          EOF

          diff expected output

      - name: Check initial audit logs
        run: |
          # https://github.com/dogtagpki/pki/wiki/Audit-Events

          # check audit log folder
          docker exec pki ls -1 /var/lib/pki/pki-tomcat/logs/ca/signedAudit | tee output

          # there should be one log file
          cat > expected << EOF
          ca_audit
          EOF

          diff expected output

          # get audit log files
          docker exec pki pki-server ca-audit-file-find | tee output

          sed -n "s/^\s*File name: \s*\(\S*\)$/\1/p" output > actual

          # there should be one log file
          cat > expected << EOF
          ca_audit
          EOF

          diff expected actual

          # get initial audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # normalize output
          # ignore SSL session events since they depend on server startup time
          sed -E \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/d' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/d' \
              -e 's/^.*\[AuditEvent=(CERT_SIGNING_INFO)\].*\[SubjectID=([^]]*)\].*$/\1 \2/' \
              -e 's/^.*\[AuditEvent=(CRL_SIGNING_INFO)\].*\[SubjectID=([^]]*)\].*$/\1 \2/' \
              -e 's/^.*\[AuditEvent=(OCSP_SIGNING_INFO)\].*\[SubjectID=([^]]*)\].*$/\1 \2/' \
              -e 's/^.*\[AuditEvent=(SELFTESTS_EXECUTION)\].*\[SubjectID=([^]]*)\].*$/\1 \2/' \
              output > actual

          cat > expected << EOF
          CERT_SIGNING_INFO \$System\$
          CRL_SIGNING_INFO \$System\$
          OCSP_SIGNING_INFO \$System\$
          SELFTESTS_EXECUTION \$System\$
          EOF

          diff expected actual

          # check SSL session events
          sed -En \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/p' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/p' \
              output > actual

          # there should be some SSL session events
          [ -s actual ]

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $NEW_LOGS > total_logs

      - name: Install admin cert
        run: |
          docker exec pki pki-server cert-export \
              --cert-file ca_signing.crt \
              ca_signing

          docker exec pki pki nss-cert-import \
              --cert ca_signing.crt \
              --trust CT,C,C \
              ca_signing

          docker exec pki pki pkcs12-import \
              --pkcs12 /root/.dogtag/pki-tomcat/ca_admin_cert.p12 \
              --password Secret.123

      - name: Check admin user
        run: |
          docker exec pki pki -n caadmin ca-user-show caadmin

          sleep 5  # wait for buffer to flush

          TOTAL_LOGS=$(cat total_logs)
          echo "TOTAL_LOGS: $TOTAL_LOGS"

          # get new audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E \
                  -e "1,${TOTAL_LOGS}d" \
                  -e 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # normalize output
          sed -E \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_ESTABLISH)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_TERMINATED)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(AUTH)\].*\[SubjectID=([^]]*)\].*\[AuthMgr=([^]]*)\].*$/\1 \2 \3/' \
              -e 's/^.*\[AuditEvent=(AUTHZ)\].*\[SubjectID=([^]]*)\].*\[aclResource=([^]]*)\].*\[Op=([^]]*)\].*$/\1 \2 \3 \4/' \
              -e 's/^.*\[AuditEvent=(ROLE_ASSUME)\].*\[SubjectID=([^]]*)\].*\[Role=([^]]*)\].*$/\1 \2 "\3"/' \
              output > actual

          cat > expected << EOF
          AUTHZ \$NonRoleUser\$ certServer.ee.request.ocsp submit
          ACCESS_SESSION_ESTABLISH "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          AUTH caadmin certUserDBAuthMgr
          AUTHZ caadmin certServer.ca.account login
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          AUTHZ caadmin certServer.ca.users execute
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          AUTHZ caadmin certServer.ca.account logout
          ROLE_ASSUME caadmin "Administrators,Certificate Manager Agents,Enterprise CA Administrators,Enterprise EST Administrators,Enterprise KRA Administrators,Enterprise OCSP Administrators,Enterprise RA Administrators,Enterprise TKS Administrators,Enterprise TPS Administrators,Security Domain Administrators"
          ACCESS_SESSION_TERMINATED "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          ACCESS_SESSION_TERMINATED "CN=PKI Administrator,E=caadmin@example.com,OU=pki-tomcat,O=EXAMPLE"
          EOF

          diff expected actual

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $((TOTAL_LOGS + NEW_LOGS)) > total_logs

      - name: Check audit config
        run: |
