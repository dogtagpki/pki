      - name: Export audit log files
        run: |
          # https://github.com/dogtagpki/pki/wiki/Accessing-Audit-Logs

          docker exec pki pki \
              -n auditor \
              ca-audit-file-retrieve \
              --output $SHARED/ca_audit \
              ca_audit

          sleep 5  # wait for buffer to flush

          TOTAL_LOGS=$(cat total_logs)
          echo "TOTAL_LOGS: $TOTAL_LOGS"

          # get new audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E \
                  -e "1,${TOTAL_LOGS}d" \
                  -e 's/^.*(\[AuditEvent=.*)$/\1/' \
