name: CA audit
# This test will perform the following operations:
# - install CA
# - check default audit config
# - check default audit events
# - check initial audit logs
# - check admin user
# - check audit config
# - export audit config
# - check audit signing cert request
# - check audit signing cert
# - check audit signing cert status
# - enable audit log signing
# - restart CA
# - create auditor user
# - add auditor user to Auditors group
# - create auditor password
# - create auditor cert
# - assign auditor cert to auditor user
# - check audit log files with username/password
# - check audit log files with client cert
# - export audit log files
# - check exported audit log files
# - check valid audit log signatures
# - check invalid audit log signatures
# - remove CA
#
# The NEW_LOGS and TOTAL_LOGS variables are used to get
# the audit logs generated by each operation so they
# can be verified.
#
# Currently each ACCESS_SESSION_ESTABLISH event has two
# ACCESS_SESSION_TERMINATED events. This needs further
# investigation.

on: workflow_call

env:
  DS_IMAGE: ${{ vars.DS_IMAGE || 'quay.io/389ds/dirsrv' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      SHARED: /tmp/workdir/pki
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Retrieve PKI images
        uses: actions/cache@v5
        with:
          key: pki-images-${{ github.sha }}
          path: pki-images.tar

      - name: Load PKI images
        run: docker load --input pki-images.tar

      - name: Create network
        run: docker network create example

      - name: Set up DS container
        run: |
          tests/bin/ds-create.sh \
              --image=${{ env.DS_IMAGE }} \
              --hostname=ds.example.com \
              --network=example \
              --network-alias=ds.example.com \
              --password=Secret.123 \
              ds

      - name: Set up PKI container
        run: |
          tests/bin/runner-init.sh \
              --hostname=pki.example.com \
              --network=example \
              --network-alias=pki.example.com \
              pki

      - name: Install CA
        run: |
          # docs/installation/ca/installing-ca.adoc

          docker exec pki pkispawn \
              -f /usr/share/pki/server/examples/installation/ca.cfg \
              -s CA \
              -D pki_ds_url=ldap://ds.example.com:3389 \
              -v

      - name: Check default audit config
        run: |
          # https://github.com/dogtagpki/pki/wiki/Configuring-Audit

          docker exec pki pki-server ca-config-find \
              | sed -n \
                  -e '/^ca\.audit_signing\..*=/p' \
                  -e '/^ca\.cert\.audit_signing\..*=/p' \
                  -e '/^ca\.cert\.list=/p' \
              | tee output

          cat > expected << EOF
          ca.audit_signing.defaultSigningAlgorithm=SHA256withRSA
          ca.audit_signing.nickname=ca_audit_signing
          ca.audit_signing.tokenname=internal
          ca.cert.audit_signing.certusage=ObjectSigner
          ca.cert.audit_signing.nickname=ca_audit_signing
          ca.cert.list=signing,ocsp_signing,sslserver,subsystem,audit_signing
          EOF

          diff expected output

          docker exec pki pki-server ca-audit-config-show | tee output

          cat > expected << EOF
            Enabled: True
            Log File: /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit
            Buffer Size (bytes): 512
            Flush Interval (seconds): 5
            Max File Size (bytes): 2000
            Rollover Interval (seconds): 2592000
            Expiration Time (seconds): 0
            Log Signing: False
            Signing Certificate: ca_audit_signing
          EOF

          diff expected output

      - name: Check default audit events
        run: |
          # https://github.com/dogtagpki/pki/wiki/PKI-Server-Audit-CLI

          docker exec pki pki-server ca-audit-event-find | tee output

          cat > expected << EOF
          ------------------
          57 entries matched
          ------------------
            Event Name: ACCESS_SESSION_ESTABLISH
            Enabled: True
            Filter: None

            Event Name: ACCESS_SESSION_TERMINATED
            Enabled: True
            Filter: None

            Event Name: AUDIT_LOG_DELETE
            Enabled: False
            Filter: None

            Event Name: AUDIT_LOG_SHUTDOWN
            Enabled: False
            Filter: None

            Event Name: AUDIT_LOG_SIGNING
            Enabled: True
            Filter: None

            Event Name: AUDIT_LOG_STARTUP
            Enabled: True
            Filter: None

            Event Name: AUTH
            Enabled: True
            Filter: None

            Event Name: AUTHORITY_CONFIG
            Enabled: True
            Filter: None

            Event Name: AUTHZ
            Enabled: True
            Filter: None

            Event Name: CERT_PROFILE_APPROVAL
            Enabled: True
            Filter: None

            Event Name: CERT_REQUEST_PROCESSED
            Enabled: True
            Filter: None

            Event Name: CERT_SIGNING_INFO
            Enabled: True
            Filter: None

            Event Name: CERT_STATUS_CHANGE_REQUEST
            Enabled: True
            Filter: None

            Event Name: CERT_STATUS_CHANGE_REQUEST_PROCESSED
            Enabled: True
            Filter: None

            Event Name: CIMC_CERT_VERIFICATION
            Enabled: False
            Filter: None

            Event Name: CLIENT_ACCESS_SESSION_ESTABLISH
            Enabled: True
            Filter: None

            Event Name: CLIENT_ACCESS_SESSION_TERMINATED
            Enabled: True
            Filter: None

            Event Name: CMC_ID_POP_LINK_WITNESS
