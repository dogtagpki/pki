          diff expected actual

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $((TOTAL_LOGS + NEW_LOGS)) > total_logs

      - name: Export audit log files
        run: |
          # https://github.com/dogtagpki/pki/wiki/Accessing-Audit-Logs

          docker exec pki pki \
              -n auditor \
              ca-audit-file-retrieve \
              --output $SHARED/ca_audit \
              ca_audit

          sleep 5  # wait for buffer to flush

          TOTAL_LOGS=$(cat total_logs)
          echo "TOTAL_LOGS: $TOTAL_LOGS"

          # get new audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E \
                  -e "1,${TOTAL_LOGS}d" \
                  -e 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # normalize output
          sed -E \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_ESTABLISH)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_TERMINATED)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(AUTH)\].*\[SubjectID=([^]]*)\].*\[AuthMgr=([^]]*)\].*$/\1 \2 \3/' \
              -e 's/^.*\[AuditEvent=(AUTHZ)\].*\[SubjectID=([^]]*)\].*\[aclResource=([^]]*)\].*\[Op=([^]]*)\].*$/\1 \2 \3 \4/' \
              -e 's/^.*\[AuditEvent=(ROLE_ASSUME)\].*\[SubjectID=([^]]*)\].*\[Role=([^]]*)\].*$/\1 \2 "\3"/' \
              output > actual

          cat > expected << EOF
          AUTHZ \$NonRoleUser\$ certServer.ee.request.ocsp submit
          ACCESS_SESSION_ESTABLISH "UID=auditor"
          AUTH auditor certUserDBAuthMgr
          AUTHZ auditor certServer.ca.account login
          ROLE_ASSUME auditor "Auditors"
          AUTHZ auditor certServer.log.content.signedAudit read
          ROLE_ASSUME auditor "Auditors"
          AUTHZ auditor certServer.ca.account logout
          ROLE_ASSUME auditor "Auditors"
          ACCESS_SESSION_TERMINATED "UID=auditor"
          ACCESS_SESSION_TERMINATED "UID=auditor"
          EOF

          diff expected actual

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $((TOTAL_LOGS + NEW_LOGS)) > total_logs

      - name: Check exported audit log files
        run: |
          # ideally the exported audit log file should be
          # identical to the actual audit log file stored on
          # the server, but the exported file will be shorter
          # than the actual file since after exporting the
          # file the pki ca-audit-file-retrieve will perform
          # a logout operation which will only be recorded in
          # the actual log file. so in order to compare
          # properly the actual log file needs to be trimmed
          # to match the size of the exported log file.

          # get the size of exported audit log file
          SIZE=$(stat -c '%s' ca_audit)
          echo "SIZE: $SIZE"

          # trim actual audit log file to match exported file
          docker exec pki head \
              -c $SIZE \
              /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              > expected

          diff expected ca_audit

      - name: Check audit log signatures
        run: |
          # https://github.com/dogtagpki/pki/wiki/Verifying-Signed-Audit-Logs

          docker exec pki pki-server cert-export \
              --cert-file ca_audit_signing.crt \
              ca_audit_signing

          docker exec pki pki nss-cert-import \
              --cert ca_audit_signing.crt \
              --trust ,,P \
              ca_audit_signing

          cat > filenames << EOF
          $SHARED/ca_audit
          EOF

          docker exec pki AuditVerify \
              -d /root/.dogtag/nssdb \
              -n ca_audit_signing \
              -a $SHARED/filenames \
              | tee output

          # normalize output
          sed -E -e '/^$/d' output > actual

          # there should be no signatures since log signing is disabled
          cat > expected << EOF
          Verification process complete.
          Valid signatures: 0
          Invalid signatures: 0
          EOF

          diff expected actual

      - name: Remove CA
        run: |
          docker exec pki pkidestroy -s CA

          TOTAL_LOGS=$(cat total_logs)
          echo "TOTAL_LOGS: $TOTAL_LOGS"

          # get new audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E \
                  -e "1,${TOTAL_LOGS}d" \
                  -e 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # normalize output
          sed -E \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_ESTABLISH)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(ACCESS_SESSION_TERMINATED)\].*\[SubjectID=([^]]*)\].*$/\1 "\2"/' \
              -e 's/^.*\[AuditEvent=(AUTH)\].*\[SubjectID=([^]]*)\].*\[AuthMgr=([^]]*)\].*$/\1 \2 \3/' \
              -e 's/^.*\[AuditEvent=(AUTHZ)\].*\[SubjectID=([^]]*)\].*\[aclResource=([^]]*)\].*\[Op=([^]]*)\].*$/\1 \2 \3 \4/' \
              -e 's/^.*\[AuditEvent=(ROLE_ASSUME)\].*\[SubjectID=([^]]*)\].*\[Role=([^]]*)\].*$/\1 \2 "\3"/' \
              -e 's/^.*\[AuditEvent=(CONFIG_ROLE)\].*\[SubjectID=([^]]*)\].*\[ParamNameValPairs=([^]]*)\].*$/\1 \2 \3/' \
              -e 's/^(CONFIG_ROLE .*) Scope;;([^+]*).*Operation;;(OP_DELETE)\+.*resource;;([^+]*).*/\1 \2 \3 "\4"/' \
              -e 's/^(CONFIG_ROLE .*) Scope;;([^+]*).*Operation;;(OP_DELETE_USER)\+.*resource;;([^+]*).*user;;([^+]*).*/\1 \2 \3 "\4" "\5"/' \
              -e 's/^.*\[AuditEvent=(SECURITY_DOMAIN_UPDATE)\].*\[SubjectID=([^]]*)\].*\[ParamNameValPairs=([^]]*)\].*$/\1 \2 \3/' \
              -e 's/^(SECURITY_DOMAIN_UPDATE .*) .*\+name;;([^+]*).*operation;;([^+]*).*/\1 \3 "\2"/' \
              output > actual

          # TODO: investigate missing OCSP and ACCESS_SESSION_TERMINATED events
          cat > expected << EOF
          ACCESS_SESSION_ESTABLISH "CN=Subsystem Certificate,OU=pki-tomcat,O=EXAMPLE"
          AUTH CA-pki.example.com-8443 certUserDBAuthMgr
          AUTHZ CA-pki.example.com-8443 certServer.securitydomain.domainxml modify
          ROLE_ASSUME CA-pki.example.com-8443 "Subsystem Group"
          CONFIG_ROLE CA-pki.example.com-8443 users OP_DELETE "uid=CA-pki.example.com-8443,ou=People,dc=ca,dc=pki,dc=example,dc=com"
          CONFIG_ROLE CA-pki.example.com-8443 groups OP_DELETE_USER "Subsystem Group" "uid=CA-pki.example.com-8443,ou=People,dc=ca,dc=pki,dc=example,dc=com"
          SECURITY_DOMAIN_UPDATE CA-pki.example.com-8443 remove "CA pki.example.com 8443"
          EOF

          diff expected actual

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $((TOTAL_LOGS + NEW_LOGS)) > total_logs

      - name: Check DS server systemd journal
        if: always()
        run: |
          docker exec ds journalctl -x --no-pager -u dirsrv@localhost.service

      - name: Check DS container logs
