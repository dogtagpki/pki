name: ACME with Caddy
# This test will perform the following operations:
# - create CA with ECC
# - enable ECC in acmeServerCert profile
# - create ACME
# - enable TLS-ALPN-01 validator (tls-alpn-01 only)
# - check initial ACME records
# - check initial certs in CA
# - configure Caddy to use ECC
# - start Caddy
# - check Caddy certs
# - check HTTPS connection
# - check ACME records after enrollment
# - check certs in CA after enrollment
# - stop Caddy
# - remove ACME
# - remove CA

on: workflow_call

env:
  # use DS container image by default to create DS with BDB
  # backend which does not require rebuilding the indexes:
  # https://github.com/dogtagpki/pki/issues/5160
  DS_IMAGE: ${{ vars.DS_IMAGE || 'quay.io/389ds/dirsrv' }}

jobs:
  test:
    name: Test (${{ matrix.challenge }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        challenge: [ http-01 , tls-alpn-01 ]
    env:
      SHARED: /tmp/workdir/pki
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Retrieve ACME images
        uses: actions/cache@v5
        with:
          key: acme-images-${{ github.sha }}
          path: acme-images.tar

      - name: Load ACME images
        run: docker load --input acme-images.tar

      - name: Create network
        run: docker network create example

      - name: Set up DS container
        run: |
          tests/bin/ds-create.sh \
              --image=${{ env.DS_IMAGE }} \
              --hostname=ds.example.com \
              --network=example \
              --network-alias=ds.example.com \
              --password=Secret.123 \
              ds

          docker exec ds dsconf \
              localhost \
              backend \
              config \
              get \
              | tee output

          # DS backend should be BDB
          echo "nsslapd-backend-implement: bdb" > expected
          cat output | sed -n "/^nsslapd-backend-implement:/p" > actual

          diff expected actual

      - name: Set up PKI container
        run: |
          tests/bin/runner-init.sh \
              --hostname=pki.example.com \
              --network=example \
              --network-alias=pki.example.com \
              pki

      - name: Create CA with ECC
        run: |
          # docs/installation/ca/installing-ca-with-ecc.adoc
          docker exec pki pkispawn \
              -f /usr/share/pki/server/examples/installation/ca-ecc.cfg \
              -s CA \
              -D pki_ds_url=ldap://ds.example.com:3389 \
              -v

      - name: Enable SSL handshake debugging
        if: always()
        run: |
          # the logs will appear in PKI server systemd journal
          docker exec pki sed -i \
              -e 's/^\(JAVA_OPTS\)="\(.*\)"$/\1="\2 -Djavax.net.debug=ssl:handshake"/' \
              /etc/sysconfig/pki-tomcat

          docker exec pki cat /etc/sysconfig/pki-tomcat

      - name: Disable access log buffer
        run: |
          docker exec pki dnf install -y xmlstarlet

          docker exec pki xmlstarlet edit --inplace \
              -u "//Valve[@className='org.apache.catalina.valves.AccessLogValve']/@buffered" \
              -v "false" \
              -i "//Valve[@className='org.apache.catalina.valves.AccessLogValve' and not(@buffered)]" \
              -t attr \
              -n "buffered" \
              -v "false" \
              /etc/pki/pki-tomcat/server.xml

      - name: Enable ECC in acmeServerCert profile
        run: |
          # allow EC keys
          # EC signatures already allowed by default
          # https://github.com/dogtagpki/pki/wiki/Configuring-ACME-with-PKI-Issuer
          docker exec pki sed -i \
              '/^policyset.serverCertSet.10.constraint.name=Key Constraint/a \
          policyset.serverCertSet.10.constraint.params.allowedKeys.EC.nistp256=true\
          policyset.serverCertSet.10.constraint.params.allowedKeys.EC.nistp384=true\
          policyset.serverCertSet.10.constraint.params.allowedKeys.EC.nistp521=true' \
              /var/lib/pki/pki-tomcat/conf/ca/profiles/ca/acmeServerCert.cfg

          docker exec pki cat /var/lib/pki/pki-tomcat/conf/ca/profiles/ca/acmeServerCert.cfg

      - name: Restart CA
        run: |
          docker exec pki pki-server ca-redeploy --wait

      - name: Install CA admin cert
        run: |
          docker exec pki pki-server cert-export \
              --cert-file $SHARED/ca_signing.crt \
              ca_signing

          docker exec pki pki nss-cert-import \
              --cert $SHARED/ca_signing.crt \
              --trust CT,C,C \
              ca_signing

          docker exec pki pki pkcs12-import \
              --pkcs12 /root/.dogtag/pki-tomcat/ca_admin_cert.p12 \
              --pkcs12-password Secret.123

          docker exec pki pki -n caadmin ca-user-show caadmin

      - name: Create ACME
        run: |
          # docs/installation/acme/installing-acme-responder.adoc
          docker exec pki pkispawn \
              -f /usr/share/pki/server/examples/installation/acme.cfg \
              -s ACME \
              -D acme_database_url=ldap://ds.example.com:3389 \
              -D acme_issuer_url=https://pki.example.com:8443 \
              -D acme_realm_url=ldap://ds.example.com:3389 \
              --debug \
              > >(tee stdout) 2> >(tee stderr >&2)

      - name: Check for warnings
        if: always()
        run: |
          sed -n '/^WARNING:/p' stderr | tee output
          diff /dev/null output

      - name: Check external commands
        if: always()
        run: |
          sed -n '/^DEBUG: Command:/p' stderr | tee output
          wc -l output

      - name: Initialize ACME database
        run: |
          # this command will rebuild the indexes which is
          # not required for BDB backend but should not cause
          # any problem
          docker exec pki pki-server acme-database-init -v

      - name: Initialize ACME realm
        run: |
          docker exec pki pki-server acme-realm-init -v

      - name: Enable TLS-ALPN-01 validator
        if: matrix.challenge == 'tls-alpn-01'
        run: |
          # docs/admin/acme/Configuring-ACME-Validators.adoc
          docker exec -i pki tee /var/lib/pki/pki-tomcat/conf/acme/validators.conf << EOF
          dns-01.class=org.dogtagpki.acme.validator.DNS01Validator
          http-01.class=org.dogtagpki.acme.validator.HTTP01Validator
          tls-alpn-01.class=org.dogtagpki.acme.validator.TLSALPN01Validator
          EOF

          docker exec pki chown pkiuser:pkiuser /var/lib/pki/pki-tomcat/conf/acme/validators.conf

          docker exec pki ls -l /var/lib/pki/pki-tomcat/conf/acme

          docker exec pki pki-server restart --wait

      - name: Check initial ACME accounts
        run: |
          docker exec ds ldapsearch \
              -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager" \
              -w Secret.123 \
              -b ou=accounts,dc=acme,dc=pki,dc=example,dc=com \
              -s one \
              -o ldif_wrap=no \
              -LLL | tee output

          # there should be no accounts
          echo "0" > expected
          grep "^dn:" output | wc -l > actual
          diff expected actual

      - name: Check initial ACME orders
        run: |
          docker exec ds ldapsearch \
              -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager" \
              -w Secret.123 \
              -b ou=orders,dc=acme,dc=pki,dc=example,dc=com \
              -s one \
              -o ldif_wrap=no \
              -LLL | tee output

          # there should be no orders
          echo "0" > expected
          grep "^dn:" output | wc -l > actual
          diff expected actual

      - name: Check initial ACME authorizations
        run: |
          docker exec ds ldapsearch \
              -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager" \
              -w Secret.123 \
              -b ou=authorizations,dc=acme,dc=pki,dc=example,dc=com \
              -s one \
              -o ldif_wrap=no \
              -LLL | tee output

          # there should be no authorizations
          echo "0" > expected
          grep "^dn:" output | wc -l > actual
          diff expected actual

      - name: Check initial ACME challenges
        run: |
          docker exec ds ldapsearch \
              -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager" \
              -w Secret.123 \
              -b ou=challenges,dc=acme,dc=pki,dc=example,dc=com \
              -s one \
              -o ldif_wrap=no \
              -LLL | tee output

          # there should be no challenges
          echo "0" > expected
          grep "^dn:" output | wc -l > actual
          diff expected actual

      - name: Check initial ACME certs
        run: |
          docker exec ds ldapsearch \
              -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager" \
              -w Secret.123 \
              -b ou=certificates,dc=acme,dc=pki,dc=example,dc=com \
              -s one \
              -o ldif_wrap=no \
              -LLL | tee output

          # there should be no certs
          echo "0" > expected
          grep "^dn:" output | wc -l > actual
          diff expected actual

      - name: Check initial certs in CA
        run: |
          docker exec pki pki ca-cert-find | tee output

          # there should be 6 certs
          echo "6" > expected
          grep "Serial Number:" output | wc -l > actual
          diff expected actual

      - name: Set up Caddy container
        run: |
          tests/bin/runner-init.sh \
              --hostname=caddy.example.com \
              --network=example \
              --network-alias=caddy.example.com \
              caddy

      - name: Install Caddy
        run: |
          docker exec caddy dnf install -y caddy
          docker exec caddy rpm -ql caddy

      - name: Configure Caddy to use ECC
        run: |
          docker exec caddy cat /etc/caddy/Caddyfile

          # install CA signing cert
          docker exec caddy cp $SHARED/ca_signing.crt /etc/caddy

          # create log folder
          docker exec caddy mkdir -p /var/log/caddy
          docker exec caddy chown caddy:caddy /var/log/caddy

          # disable the challenge that is not being tested
          if [ "${{ matrix.challenge }}" = "tls-alpn-01" ]; then
              DISABLED_CHALLENGE=disable_http_challenge
          else
              DISABLED_CHALLENGE=disable_tlsalpn_challenge
          fi

          # configure ACME, key type, and logging
          docker exec -i caddy tee /etc/caddy/Caddyfile << EOF
          {
              cert_issuer acme {
                  dir https://pki.example.com:8443/acme/directory
                  trusted_roots /etc/caddy/ca_signing.crt
                  $DISABLED_CHALLENGE
              }
              key_type p256
          }

          caddy.example.com {
              root * /usr/share/caddy
              file_server

              log {
                  output file /var/log/caddy/access.log
              }
          }

          import Caddyfile.d/*.caddyfile
          EOF

      - name: Start Caddy
        run: |
          docker exec caddy cat /lib/systemd/system/caddy.service
          docker exec caddy cat /usr/lib/sysusers.d/caddy.conf

          docker exec caddy systemctl start caddy

          # wait for Caddy to start and perform cert enrollment
          sleep 60

      - name: Get Caddy cert chain
        run: |
          # get cert chain
          docker exec caddy openssl s_client \
              -connect caddy.example.com:443 \
              -showcerts \
              | tee output

          # split cert chain
          awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/{ if(/BEGIN CERTIFICATE/){a++}; out="caddy-"a".crt"; print >out}' output
          ls -la

      - name: Check Caddy cert
        run: |
          openssl x509 -text -noout \
              -in caddy-1.crt \
              | tee output

          # normalize output
          # - remove hex string
          # - remove date and time
          # - normalize issuer and subject
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Serial Number:$/d' \
              -e '/^ *Validity$/d' \
              -e '/^ *Not Before:/d' \
              -e '/^ *Not After :/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e '/^$/d' \
              -e 's/ *$//' \
              -e 's/^( *Issuer): O=(.*), OU=(.*), CN=(.*)$/\1: O = \2, OU = \3, CN = \4/' \
              -e 's/^( *Subject): CN=(.*)$/\1: CN = \2/' \
              output > actual

          # cert should have EC key and signature
          # TODO: investigate differences with CA's SSL server cert
          # - missing Data Encipherment Key Usage
          # - extra TLS Web Client Authentication Extended Key Usage
          # - extra Basic Constraints
          # - extra Certificate Policies
          # - extra Subject Key Identifier
          cat > expected << EOF
          Certificate:
              Data:
                  Version: 3 (0x2)
                  Signature Algorithm: ecdsa-with-SHA512
                  Issuer: O = EXAMPLE, OU = pki-tomcat, CN = CA Signing Certificate
                  Subject: CN = caddy.example.com
                  Subject Public Key Info:
                      Public Key Algorithm: id-ecPublicKey
                          Public-Key: (256 bit)
                          pub:
                          ASN1 OID: prime256v1
                          NIST CURVE: P-256
                  X509v3 extensions:
                      X509v3 Key Usage: critical
                          Digital Signature, Key Encipherment
                      X509v3 Extended Key Usage:
                          TLS Web Server Authentication, TLS Web Client Authentication
                      X509v3 Basic Constraints: critical
                          CA:FALSE
                      X509v3 Authority Key Identifier:
                      Authority Information Access:
                          OCSP - URI:http://pki.example.com:8080/ca/ocsp
                      X509v3 Subject Alternative Name:
                          DNS:caddy.example.com
                      X509v3 Certificate Policies:
                          Policy: 2.23.140.1.2.1
                      X509v3 Subject Key Identifier:
              Signature Algorithm: ecdsa-with-SHA512
          EOF

          diff expected actual

      - name: Check CA signing cert
        run: |
          openssl x509 -text -noout \
              -in caddy-2.crt \
              | tee output

          # normalize output
          # - remove hex string
          # - remove date and time
          # - normalize issuer and subject
          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Serial Number:$/d' \
              -e '/^ *Validity$/d' \
              -e '/^ *Not Before:/d' \
              -e '/^ *Not After :/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
              -e '/^$/d' \
              -e 's/ *$//' \
              -e 's/^( *Issuer): O=(.*), OU=(.*), CN=(.*)$/\1: O = \2, OU = \3, CN = \4/' \
              -e 's/^( *Subject): O=(.*), OU=(.*), CN=(.*)$/\1: O = \2, OU = \3, CN = \4/' \
              output > actual

          # cert should have EC key and signature
          cat > expected << EOF
          Certificate:
              Data:
                  Version: 3 (0x2)
                  Signature Algorithm: ecdsa-with-SHA384
                  Issuer: O = EXAMPLE, OU = pki-tomcat, CN = CA Signing Certificate
                  Subject: O = EXAMPLE, OU = pki-tomcat, CN = CA Signing Certificate
                  Subject Public Key Info:
                      Public Key Algorithm: id-ecPublicKey
                          Public-Key: (521 bit)
                          pub:
                          ASN1 OID: secp521r1
                          NIST CURVE: P-521
                  X509v3 extensions:
                      X509v3 Subject Key Identifier:
                      X509v3 Authority Key Identifier:
                      X509v3 Basic Constraints: critical
                          CA:TRUE
                      X509v3 Key Usage: critical
                          Digital Signature, Non Repudiation, Certificate Sign, CRL Sign
              Signature Algorithm: ecdsa-with-SHA384
          EOF

          diff expected actual

      - name: Check HTTPS connection
        run: |
          docker exec caddy curl \
              --cacert $SHARED/ca_signing.crt \
              --silent \
              --fail-with-body \
              --show-error \
              https://caddy.example.com

      - name: Check ACME accounts after enrollment
        run: |
          docker exec ds ldapsearch \
              -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager" \
              -w Secret.123 \
              -b ou=accounts,dc=acme,dc=pki,dc=example,dc=com \
              -s one \
              -o ldif_wrap=no \
              -LLL | tee output

          # normalize output
          cat output \
              | sed -E \
                  -e 's/^dn: acmeAccountId=[^,]*,/dn: acmeAccountId=XXXXX,/' \
                  -e 's/^acmeAccountId: .*$/acmeAccountId: XXXXX/' \
                  -e 's/^acmeCreated: .*$/acmeCreated: XXXXX/' \
                  -e 's/^acmeAccountKey: .*$/acmeAccountKey: XXXXX/' \
                  -e '/^$/d' \
              > actual

          # there should be one valid account
          cat > expected << EOF
          dn: acmeAccountId=XXXXX,ou=accounts,dc=acme,dc=pki,dc=example,dc=com
          objectClass: acmeAccount
          acmeAccountId: XXXXX
          acmeCreated: XXXXX
          acmeAccountKey: XXXXX
          acmeStatus: valid
          EOF

          diff expected actual

          # normalize account key
          cat output \
              | sed -n 's/^acmeAccountKey: \(.*\)$/\1/p' \
              | jq '.x = "XXXXX" | .y = "XXXXX"'\
              > actual

          # account key should be ECC
          cat > expected << EOF
          {
            "crv": "P-256",
            "kty": "EC",
            "x": "XXXXX",
            "y": "XXXXX"
          }
          EOF

          diff expected actual

      - name: Check ACME orders after enrollment
        run: |
          docker exec ds ldapsearch \
              -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager" \
              -w Secret.123 \
              -b ou=orders,dc=acme,dc=pki,dc=example,dc=com \
              -s one \
              -o ldif_wrap=no \
              -LLL | tee output

          # normalize output
          cat output \
              | sed -E \
                  -e 's/^dn: acmeOrderId=[^,]*,/dn: acmeOrderId=XXXXX,/' \
                  -e 's/^acmeOrderId: .*$/acmeOrderId: XXXXX/' \
                  -e 's/^acmeAccountId: .*$/acmeAccountId: XXXXX/' \
                  -e 's/^acmeCreated: .*$/acmeCreated: XXXXX/' \
                  -e 's/^acmeAuthorizationId: .*$/acmeAuthorizationId: XXXXX/' \
                  -e 's/^acmeExpires: .*$/acmeExpires: XXXXX/' \
                  -e 's/^acmeCertificateId: .*$/acmeCertificateId: XXXXX/' \
                  -e '/^$/d' \
              > actual

          # there should be one valid order
          cat > expected << EOF
          dn: acmeOrderId=XXXXX,ou=orders,dc=acme,dc=pki,dc=example,dc=com
          objectClass: acmeOrder
          acmeOrderId: XXXXX
          acmeAccountId: XXXXX
          acmeCreated: XXXXX
          acmeStatus: valid
          acmeAuthorizationId: XXXXX
          acmeExpires: XXXXX
          acmeIdentifier: dns:caddy.example.com
          acmeCertificateId: XXXXX
          EOF

          diff expected actual

      - name: Check ACME authorizations after enrollment
        run: |
          docker exec ds ldapsearch \
              -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager" \
              -w Secret.123 \
              -b ou=authorizations,dc=acme,dc=pki,dc=example,dc=com \
              -s one \
              -o ldif_wrap=no \
              -LLL | tee output

          # normalize output
          cat output \
              | sed -E \
                  -e 's/^dn: acmeAuthorizationId=[^,]*,/dn: acmeAuthorizationId=XXXXX,/' \
                  -e 's/^acmeAuthorizationId: .*$/acmeAuthorizationId: XXXXX/' \
                  -e 's/^acmeAccountId: .*$/acmeAccountId: XXXXX/' \
                  -e 's/^acmeCreated: .*$/acmeCreated: XXXXX/' \
                  -e 's/^acmeExpires: .*$/acmeExpires: XXXXX/' \
                  -e 's/^acmeCertificateId: .*$/acmeCertificateId: XXXXX/' \
                  -e '/^$/d' \
              > actual

          # there should be one valid authorization
          cat > expected << EOF
          dn: acmeAuthorizationId=XXXXX,ou=authorizations,dc=acme,dc=pki,dc=example,dc=com
          objectClass: acmeAuthorization
          acmeAuthorizationId: XXXXX
          acmeAccountId: XXXXX
          acmeCreated: XXXXX
          acmeStatus: valid
          acmeIdentifier: dns:caddy.example.com
          acmeExpires: XXXXX
          acmeAuthorizationWildcard: FALSE
          EOF

          diff expected actual

      - name: Check ACME challenges after enrollment
        run: |
          docker exec ds ldapsearch \
              -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager" \
              -w Secret.123 \
              -b ou=challenges,dc=acme,dc=pki,dc=example,dc=com \
              -s one \
              -o ldif_wrap=no \
              -LLL | tee output

          # normalize output
          cat output \
              | sed -E \
                  -e 's/^dn: acmeChallengeId=[^,]*,/dn: acmeChallengeId=XXXXX,/' \
                  -e 's/^acmeChallengeId: .*$/acmeChallengeId: XXXXX/' \
                  -e 's/^acmeAuthorizationId: .*$/acmeAuthorizationId: XXXXX/' \
                  -e 's/^acmeAccountId: .*$/acmeAccountId: XXXXX/' \
                  -e 's/^acmeToken: .*$/acmeToken: XXXXX/' \
                  -e '/^$/d' \
              > actual

          if [ "${{ matrix.challenge }}" = "tls-alpn-01" ]; then
              OBJECT_CLASS=acmeChallengeTlsAlpn01
          else
              OBJECT_CLASS=acmeChallengeHttp01
          fi

          # there should be one valid challenge of the tested type
          cat > expected << EOF
          dn: acmeChallengeId=XXXXX,ou=challenges,dc=acme,dc=pki,dc=example,dc=com
          objectClass: acmeChallenge
          objectClass: $OBJECT_CLASS
          acmeChallengeId: XXXXX
          acmeAuthorizationId: XXXXX
          acmeAccountId: XXXXX
          acmeStatus: valid
          acmeToken: XXXXX
          EOF

          diff expected actual

      - name: Check certs in ACME after enrollment
        run: |
          docker exec ds ldapsearch \
              -H ldap://ds.example.com:3389 \
              -D "cn=Directory Manager" \
              -w Secret.123 \
              -b ou=certificates,dc=acme,dc=pki,dc=example,dc=com \
              -s one \
              -o ldif_wrap=no \
              -LLL | tee output

          # there should be no certs
          echo "0" > expected
          grep "^dn:" output | wc -l > actual
          diff expected actual

      - name: Check certs in CA after enrollment
        run: |
          docker exec pki pki ca-cert-find | tee output

          # there should be 7 certs
          echo "7" > expected
          grep "Serial Number:" output | wc -l > actual

          diff expected actual

      - name: Stop Caddy
        run: |
          docker exec caddy systemctl stop caddy

      - name: Remove ACME
        run: |
          docker exec pki pkidestroy \
              -s ACME \
              --debug \
              > >(tee stdout) 2> >(tee stderr >&2)

      - name: Check for warnings
        if: always()
        run: |
          sed -n '/^WARNING:/p' stderr | tee output
          diff /dev/null output

      - name: Check external commands
        if: always()
        run: |
          sed -n '/^DEBUG: Command:/p' stderr | tee output
          wc -l output

      - name: Remove CA
        run: docker exec pki pkidestroy -s CA -v

      - name: Check DS server systemd journal
        if: always()
        run: |
          docker exec ds journalctl -x --no-pager -u dirsrv@localhost.service

      - name: Check DS container logs
        if: always()
        run: |
          docker logs ds

      - name: Check PKI server systemd journal
        if: always()
        run: |
          docker exec pki journalctl -x --no-pager -u pki-tomcatd@pki-tomcat.service

      - name: Check PKI server access log
        if: always()
        run: |
          docker exec pki find /var/log/pki/pki-tomcat -name "localhost_access_log.*" -exec cat {} \;

      - name: Check CA debug log
        if: always()
        run: |
          docker exec pki find /var/lib/pki/pki-tomcat/logs/ca -name "debug.*" -exec cat {} \;

      - name: Check ACME debug log
        if: always()
        run: |
          docker exec pki find /var/lib/pki/pki-tomcat/logs/acme -name "debug.*" -exec cat {} \;

      - name: Check Caddy systemd journal
        if: always()
        run: |
          docker exec caddy journalctl -x --no-pager -u caddy.service

      - name: Check Caddy access log
        if: always()
        run: |
          docker exec caddy cat /var/log/caddy/access.log | jq -r '"[\(.ts | strflocaltime("%Y-%m-%d %H:%M:%S"))] \(.request.method) \(.request.uri) -> Status: \(.status) (Client: \(.request.client_ip))"'

