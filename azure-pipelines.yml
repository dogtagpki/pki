jobs:
- job: BuildTest
  pool:
    vmImage: ubuntu-latest
  steps:
  - task: PythonScript@0
    displayName: Set environment variables
    env:
      REPOSITORY_URI: $(Build.Repository.Uri)
    inputs:
      scriptSource: inline
      script: |
        import os
        import re

        value = os.getenv('BASE_IMAGE', 'registry.fedoraproject.org/fedora:latest')
        print('BASE_IMAGE: {value}'.format(value=value))
        print('##vso[task.setvariable variable=BASE_IMAGE]{value}'.format(value=value))

        value = os.getenv('REGISTRY_NAMESPACE', 'dogtagpki')
        print('NAMESPACE: {value}'.format(value=value))
        print('##vso[task.setvariable variable=NAMESPACE]{value}'.format(value=value))

  - script: |
      # replace registry namespace
      sed -i "s/quay.io\/dogtagpki\//quay.io\/$NAMESPACE\//g" Dockerfile
    displayName: Update Dockerfile

  - script: |
      docker build \
          --build-arg BASE_IMAGE=$BASE_IMAGE \
          --target pki-base \
          --tag pki-base:latest \
          .

      docker run \
          --name=runner \
          -v $BUILD_SOURCESDIRECTORY:/root/src \
          --privileged \
          --detach \
          pki-base:latest

      while :
      do
          docker exec runner echo "Runner is ready" && break

          echo "Waiting for runner..."
          sleep 1
          [ $((++i)) -ge 10 ] && exit 1
      done
    displayName: Create runner container

  - script: |
      docker exec runner dnf install -y dnf-plugins-core rpm-build
      if [ -n "$COPR_REPO" ]; then docker exec runner dnf copr enable -y $COPR_REPO; fi

      docker create --name=jss-dist quay.io/$NAMESPACE/jss-dist:latest
      docker cp jss-dist:/root/RPMS/. /tmp/RPMS
      docker rm -f jss-dist

      docker create --name=ldapjdk-dist quay.io/$NAMESPACE/ldapjdk-dist:latest
      docker cp ldapjdk-dist:/root/RPMS/. /tmp/RPMS
      docker rm -f ldapjdk-dist

      docker exec runner mkdir -p RPMS
      docker cp /tmp/RPMS/. runner:RPMS
      docker exec runner bash -c "dnf install -y RPMS/*"

      docker exec runner dnf builddep -y /root/src/pki.spec
    displayName: Install PKI dependencies

  - script: |
      docker exec runner /root/src/build.sh -v rpm
    displayName: Build PKI RPM packages

  - script: |
      # find RPM packages (excluding debug packages)
      docker exec runner \
          ls /root/build/pki/RPMS | grep -v debuginfo | grep -v debugsource | tee output
      RPMS=$(cat output)

      # get list of files in each RPM package
      for rpm in $RPMS
      do
          docker exec runner \
              rpm -qlp "/root/build/pki/RPMS/$rpm" | tee -a file_list
      done

      # exclude Maven-specific and RPM-specific files
      # from comparison with CMake files
      sed -i \
          -e '/^\/usr\/share\/maven-metadata\//d' \
          -e '/^\/usr\/share\/maven-poms\//d' \
          -e '/^\/usr\/share\/licenses\//d' \
          -e '/^\/usr\/share\/man\//d' \
          -e '/^\/usr\/share\/doc\//d' \
          -e '/^\/usr\/lib\/.build-id\//d' \
          -e '/__pycache__/d' \
          file_list

      # exclude bundled libraries which are only available in RPM
      sed -i \
          -e '/^\/usr\/share\/pki\/lib\/jakarta\.activation-api.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/lib\/jakarta\.annotation-api.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/lib\/jakarta\.xml\.bind-api-.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/lib\/jackson-annotations-.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/lib\/jackson-core-.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/lib\/jackson-databind-.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/lib\/jackson-jaxrs-base-.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/lib\/jackson-jaxrs-json-provider-.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/lib\/jackson-module-jaxb-annotations-.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/lib\/jboss-jaxrs-api_2.0_spec-.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/lib\/jboss-logging-.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/lib\/resteasy-jaxrs-.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/lib\/resteasy-client-.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/lib\/resteasy-jackson2-provider-.*\.jar/d' \
          -e '/^\/usr\/share\/pki\/server\/common\/lib\/resteasy-servlet-initializer-.*\.jar/d' \
          file_list

      # exclude user management files only available in RPM
      sed -i \
          -e '/^\/usr\/lib\/sysusers\.d\/dogtag-pki\.conf/d' \
          file_list
    displayName: Get list of files from RPM packages

  - script: |
      docker exec runner mkdir -p /root/src/base/common/lib
    displayName: Create base/common/lib

  - script: |
      COMMONS_CLI_VERSION=$(
          docker exec runner rpm -q apache-commons-cli \
          | sed -n 's/^apache-commons-cli-\([^-]*\)-.*$/\1/p')

      docker exec runner cp \
          /usr/share/java/commons-cli.jar \
          /root/src/base/common/lib/commons-cli-$COMMONS_CLI_VERSION.jar
    displayName: Import apache-commons-cli

  - script: |
      COMMONS_CODEC_VERSION=$(
          docker exec runner rpm -q apache-commons-codec \
          | sed -n 's/^apache-commons-codec-\([^-]*\)-.*$/\1/p')

      docker exec runner cp \
          /usr/share/java/commons-codec.jar \
          /root/src/base/common/lib/commons-codec-$COMMONS_CODEC_VERSION.jar
    displayName: Import apache-commons-codec

  - script: |
      COMMONS_IO_VERSION=$(
          docker exec runner rpm -q apache-commons-io \
          | sed -n 's/^apache-commons-io-\([^-]*\)-.*$/\1/p')

      docker exec runner cp \
          /usr/share/java/commons-io.jar \
          /root/src/base/common/lib/commons-io-$COMMONS_IO_VERSION.jar
    displayName: Import apache-commons-io

  - script: |
      COMMONS_LANG3_VERSION=$(
          docker exec runner rpm -q apache-commons-lang3 \
          | sed -n 's/^apache-commons-lang3-\([^-]*\)-.*$/\1/p')

      docker exec runner cp \
          /usr/share/java/commons-lang3.jar \
          /root/src/base/common/lib/commons-lang3-$COMMONS_LANG3_VERSION.jar
    displayName: Import apache-commons-lang3

  - script: |
      COMMONS_LOGGING_VERSION=$(
          docker exec runner rpm -q apache-commons-logging \
          | sed -n 's/^apache-commons-logging-\([^-]*\)-.*$/\1/p')

      docker exec runner cp \
          /usr/share/java/commons-logging.jar \
          /root/src/base/common/lib/commons-logging-$COMMONS_LOGGING_VERSION.jar
    displayName: Import apache-commons-logging

  - script: |
      COMMONS_NET_VERSION=$(
          docker exec runner rpm -q apache-commons-net \
          | sed -n 's/^apache-commons-net-\([^-]*\)-.*$/\1/p')

      docker exec runner cp \
          /usr/share/java/commons-net.jar \
          /root/src/base/common/lib/commons-net-$COMMONS_NET_VERSION.jar
    displayName: Import apache-commons-net

  - script: |
      HTTPCLIENT_VERSION=$(
          docker exec runner rpm -q httpcomponents-client \
          | sed -n 's/^httpcomponents-client-\([^-]*\)-.*$/\1/p')

      docker exec runner cp \
          /usr/share/java/httpcomponents/httpclient.jar \
          /root/src/base/common/lib/httpclient-$HTTPCLIENT_VERSION.jar
    displayName: Import httpcomponents-client

  - script: |
      HTTPCORE_VERSION=$(
          docker exec runner rpm -q httpcomponents-core \
          | sed -n 's/^httpcomponents-core-\([^-]*\)-.*$/\1/p')

      docker exec runner cp \
          /usr/share/java/httpcomponents/httpcore.jar \
          /root/src/base/common/lib/httpcore-$HTTPCORE_VERSION.jar
    displayName: Import httpcomponents-core

  - script: |
      SLF4J_API_VERSION=$(
          docker exec runner rpm -q slf4j \
          | sed -n 's/^slf4j-\([^-]*\)-.*$/\1/p')

      docker exec runner cp \
          /usr/share/java/slf4j/slf4j-api.jar \
          /root/src/base/common/lib/slf4j-api-$SLF4J_API_VERSION.jar
    displayName: Import slf4j-api

  - script: |
      SLF4J_JDK14_VERSION=$(
          docker exec runner rpm -q slf4j \
          | sed -n 's/^slf4j-\([^-]*\)-.*$/\1/p')

      docker exec runner cp \
          /usr/share/java/slf4j/slf4j-jdk14.jar \
          /root/src/base/common/lib/slf4j-jdk14-$SLF4J_JDK14_VERSION.jar
    displayName: Import slf4j-jdk14

  - script: |
      JAKARTA_ACTIVATION_API_VERSION=$(
          docker exec runner rpm -q jakarta-activation \
          | sed -n 's/^jakarta-activation-\([^-]*\)-.*$/\1/p')

      docker exec runner jar tvf /usr/share/java/jakarta-activation/jakarta.activation-api.jar \
          | sed -n 's/.* \([^ ]\+\)\/[^\/]*\.class$/\1/p' \
          | sort \
          | uniq

      docker exec runner javax2jakarta \
          -logLevel=FINE \
          -profile=EE \
          /usr/share/java/jakarta-activation/jakarta.activation-api.jar \
          /root/src/base/common/lib/jakarta.activation-api-$JAKARTA_ACTIVATION_API_VERSION.jar
    displayName: Migrate jakarta-activation

  - script: |
      JAKARTA_ANNOTATION_API_VERSION=$(
          docker exec runner rpm -q jakarta-annotations \
          | sed -n 's/^jakarta-annotations-\([^-]*\)-.*$/\1/p')

      docker exec runner jar tvf /usr/share/java/jakarta-annotations/jakarta.annotation-api.jar \
          | sed -n 's/.* \([^ ]\+\)\/[^\/]*\.class$/\1/p' \
          | sort \
          | uniq

      docker exec runner javax2jakarta \
          -logLevel=FINE \
          -profile=EE \
          /usr/share/java/jakarta-annotations/jakarta.annotation-api.jar \
          /root/src/base/common/lib/jakarta.annotation-api-$JAKARTA_ANNOTATION_API_VERSION.jar
    displayName: Migrate jakarta-annotations

  - script: |
      JAXB_API_VERSION=$(
          docker exec runner rpm -q jaxb-api \
          | sed -n 's/^jaxb-api-\([^-]*\)-.*$/\1/p')

      docker exec runner jar tvf /usr/share/java/jaxb-api/jakarta.xml.bind-api.jar \
          | sed -n 's/.* \([^ ]\+\)\/[^\/]*\.class$/\1/p' \
          | sort \
          | uniq

      docker exec runner javax2jakarta \
          -logLevel=FINE \
          -profile=EE \
          /usr/share/java/jaxb-api/jakarta.xml.bind-api.jar \
          /root/src/base/common/lib/jakarta.xml.bind-api-$JAXB_API_VERSION.jar
    displayName: Migrate jaxb-api

  - script: |
      JACKSON_ANNOTATIONS_VERSION=$(
          docker exec runner rpm -q jackson-annotations \
          | sed -n 's/^jackson-annotations-\([^-]*\)-.*$/\1/p')

      docker exec runner jar tvf /usr/share/java/jackson-annotations.jar \
          | sed -n 's/.* \([^ ]\+\)\/[^\/]*\.class$/\1/p' \
          | sort \
          | uniq

      docker exec runner javax2jakarta \
          -logLevel=FINE \
          -profile=EE \
          /usr/share/java/jackson-annotations.jar \
          /root/src/base/common/lib/jackson-annotations-$JACKSON_ANNOTATIONS_VERSION.jar
    displayName: Migrate jackson-annotations

  - script: |
      JACKSON_CORE_VERSION=$(
          docker exec runner rpm -q jackson-core \
          | sed -n 's/^jackson-core-\([^-]*\)-.*$/\1/p')

      docker exec runner jar tvf /usr/share/java/jackson-core.jar \
          | sed -n 's/.* \([^ ]\+\)\/[^\/]*\.class$/\1/p' \
          | sort \
          | uniq

      docker exec runner javax2jakarta \
          -logLevel=FINE \
          -profile=EE \
          /usr/share/java/jackson-core.jar \
          /root/src/base/common/lib/jackson-core-$JACKSON_CORE_VERSION.jar
    displayName: Migrate jackson-core

  - script: |
      JACKSON_DATABIND_VERSION=$(
          docker exec runner rpm -q jackson-databind \
          | sed -n 's/^jackson-databind-\([^-]*\)-.*$/\1/p')

      docker exec runner jar tvf /usr/share/java/jackson-databind.jar \
          | sed -n 's/.* \([^ ]\+\)\/[^\/]*\.class$/\1/p' \
          | sort \
          | uniq

      docker exec runner javax2jakarta \
          -logLevel=FINE \
          -profile=EE \
          /usr/share/java/jackson-databind.jar \
          /root/src/base/common/lib/jackson-databind-$JACKSON_DATABIND_VERSION.jar
    displayName: Migrate jackson-databind

  - script: |
      JACKSON_MODULES_JAXB_ANNOTATIONS_VERSION=$(
          docker exec runner rpm -q jackson-module-jaxb-annotations \
          | sed -n 's/^jackson-module-jaxb-annotations-\([^-]*\)-.*$/\1/p')

      docker exec runner jar tvf /usr/share/java/jackson-modules/jackson-module-jaxb-annotations.jar \
          | sed -n 's/.* \([^ ]\+\)\/[^\/]*\.class$/\1/p' \
          | sort \
          | uniq

      docker exec runner javax2jakarta \
          -logLevel=FINE \
          -profile=EE \
          /usr/share/java/jackson-modules/jackson-module-jaxb-annotations.jar \
          /root/src/base/common/lib/jackson-module-jaxb-annotations-$JACKSON_MODULES_JAXB_ANNOTATIONS_VERSION.jar
    displayName: Migrate jackson-module-jaxb-annotations

  - script: |
      JAXRS_VERSION=$(
          docker exec runner rpm -q jboss-jaxrs-2.0-api \
          | sed -n 's/^jboss-jaxrs-2.0-api-\([^-]*\)-.*$/\1.Final/p')

      docker exec runner jar tvf /usr/share/java/jboss-jaxrs-2.0-api.jar \
          | sed -n 's/.* \([^ ]\+\)\/[^\/]*\.class$/\1/p' \
          | sort \
          | uniq

      docker exec runner javax2jakarta \
          -logLevel=FINE \
          -profile=EE \
          /usr/share/java/jboss-jaxrs-2.0-api.jar \
          /root/src/base/common/lib/jboss-jaxrs-api_2.0_spec-$JAXRS_VERSION.jar
    displayName: Migrate jboss-jaxrs-2.0-api

  - script: |
      JACKSON_JAXRS_PROVIDERS_VERSION=$(
          docker exec runner rpm -q jackson-jaxrs-providers \
          | sed -n 's/^ jackson-jaxrs-providers-\([^-]*\)-.*$/\1/p')

      docker exec runner jar tvf /usr/share/java/jackson-jaxrs-providers/jackson-jaxrs-base.jar \
          | sed -n 's/.* \([^ ]\+\)\/[^\/]*\.class$/\1/p' \
          | sort \
          | uniq

      docker exec runner javax2jakarta \
          -logLevel=FINE \
          -profile=EE \
          /usr/share/java/jackson-jaxrs-providers/jackson-jaxrs-base.jar \
          jackson-jaxrs-base-$JACKSON_JAXRS_PROVIDERS_VERSION.jar
    displayName: Migrate jackson-jaxrs-providers

  - script: |
      JACKSON_JAXRS_JSON_PROVIDER_VERSION=$(
          docker exec runner rpm -q jackson-jaxrs-json-provider \
          | sed -n 's/^ jackson-jaxrs-json-provider-\([^-]*\)-.*$/\1/p')

      docker exec runner jar tvf /usr/share/java/jackson-jaxrs-providers/jackson-jaxrs-json-provider.jar \
          | sed -n 's/.* \([^ ]\+\)\/[^\/]*\.class$/\1/p' \
          | sort \
          | uniq

      docker exec runner javax2jakarta \
          -logLevel=FINE \
          -profile=EE \
          /usr/share/java/jackson-jaxrs-providers/jackson-jaxrs-json-provider.jar \
          /root/src/base/common/lib/jackson-jaxrs-json-provider-$JACKSON_JAXRS_JSON_PROVIDERS_VERSION.jar
    displayName: Migrate jackson-jaxrs-json-provider

  - script: |
      RESTEASY_CORE_VERSION=$(
          docker exec runner rpm -q pki-resteasy-core \
          | sed -n 's/^ pki-resteasy-core-\([^-]*\)-.*$/\1.Final/p')

      docker exec runner jar tvf /usr/share/java/resteasy/resteasy-jaxrs.jar \
          | sed -n 's/.* \([^ ]\+\)\/[^\/]*\.class$/\1/p' \
          | sort \
          | uniq

      docker exec runner javax2jakarta \
          -logLevel=FINE \
          -profile=EE \
          /usr/share/java/resteasy/resteasy-jaxrs.jar \
          /root/src/base/common/lib/resteasy-jaxrs-$RESTEASY_CORE_VERSION.jar
    displayName: Migrate pki-resteasy-core

  - script: |
      RESTEASY_CLIENT_VERSION=$(
          docker exec runner rpm -q pki-resteasy-client \
          | sed -n 's/^ pki-resteasy-client-\([^-]*\)-.*$/\1.Final/p')

      docker exec runner jar tvf /usr/share/java/resteasy/resteasy-client.jar \
          | sed -n 's/.* \([^ ]\+\)\/[^\/]*\.class$/\1/p' \
          | sort \
          | uniq

      docker exec runner javax2jakarta \
          -logLevel=FINE \
          -profile=EE \
          /usr/share/java/resteasy/resteasy-client.jar \
          /root/src/base/common/lib/resteasy-client-$RESTEASY_CLIENT_VERSION.jar
    displayName: Migrate pki-resteasy-client

  - script: |
      docker exec runner sed -n \
          -e '/javax.ws.rs/p' \
          -e '/jakarta.ws.rs/p' \
          /root/src/base/common/pom.xml

      docker exec runner javax2jakarta \
          -logLevel=FINE \
          -profile=EE \
          -exclude=/root/src/base/tomcat-9.0 \
          /root/src/base \
          /root/src/base

      docker exec runner sed -n \
          -e '/javax.ws.rs/p' \
          -e '/jakarta.ws.rs/p' \
          /root/src/base/common/pom.xml
    displayName: Migrate PKI sources

  - script: |
      # get Python <major>.<minor> version
      docker exec runner python3 --version | tee output
      PYTHON_VERSION=$(sed 's/Python \([0-9]\+\.[0-9]\+\)\..*/\1/' output)

      docker exec runner \
          /root/src/build.sh \
          --work-dir=/root/build \
          --python-dir=/usr/lib/python$PYTHON_VERSION/site-packages \
          dist
    displayName: Build PKI with CMake

  - script: |
      docker exec runner dnf install -y xmlstarlet

      # drop tomcat-9.0 module
      docker exec runner xmlstarlet edit --inplace \
          -d "/_:project/_:modules/_:module[text()='tomcat-9.0']" \
          /root/src/base/pom.xml

      docker exec runner cat /root/src/base/pom.xml

    displayName: Customize base/pom.xml

  - script: |
      docker exec runner sed -n \
          -e '/javax.ws.rs/p' \
          -e '/jakarta.ws.rs/p' \
          /root/src/base/common/pom.xml

      # replace org.jboss.spec.jakarta.ws.rs:jboss-jaxrs-api_2.0_spec:1.0.0.Final with jakarta.ws.rs:jakarta.ws.rs-api:3.0.0
      docker exec runner xmlstarlet edit --inplace \
          -u "/_:project/_:profiles/_:profile[_:id='api-v1-deps']/_:dependencies/_:dependency[_:groupId='org.jboss.spec.jakarta.ws.rs']/_:groupId" \
          -v "jakarta.ws.rs" \
          -u "/_:project/_:profiles/_:profile[_:id='api-v1-deps']/_:dependencies/_:dependency[_:groupId='jakarta.ws.rs']/_:artifactId" \
          -v "jakarta.ws.rs-api" \
          -u "/_:project/_:profiles/_:profile[_:id='api-v1-deps']/_:dependencies/_:dependency[_:groupId='jakarta.ws.rs']/_:version" \
          -v "3.0.0" \
          /root/src/base/common/pom.xml

      docker exec runner cat /root/src/base/common/pom.xml

    displayName: Customize base/common/pom.xml

  - script: |
      # drop pki-tomcat-9.0 dependency
      docker exec runner xmlstarlet edit --inplace \
          -d "/_:project/_:dependencies/_:dependency[_:artifactId='pki-tomcat-9.0']" \
          /root/src/base/server/pom.xml

      docker exec runner cat /root/src/base/server/pom.xml

    displayName: Customize base/server/pom.xml

  - script: |
      docker exec runner mvn \
          --batch-mode \
          -f /root/src \
          -P api-v1-deps \
          -D skipTests \
          package
    displayName: Build PKI with Maven

  - script: |
      docker exec runner \
          jar tvf /root/build/dist/pki-common.jar | awk '{print $8;}' | grep -v '/$' | sort | tee pki-common.cmake
      docker exec runner \
          jar tvf /root/src/base/common/target/pki-common.jar | awk '{print $8;}' | grep -v -E '^META-INF/maven/|/$' | sort | tee pki-common.maven
      diff pki-common.cmake pki-common.maven
    displayName: Compare pki-common.jar

  - script: |
      docker exec runner \
          jar tvf /root/build/dist/pki-tools.jar | awk '{print $8;}' | grep -v '/$' | sort | tee pki-tools.cmake
      docker exec runner \
          jar tvf /root/src/base/tools/target/pki-tools.jar | awk '{print $8;}' | grep -v -E '^META-INF/maven/|/$' | sort | tee pki-tools.maven
      diff pki-tools.cmake pki-tools.maven
    displayName: Compare pki-tools.jar

  - script: |
      docker exec runner \
          jar tvf /root/build/dist/pki-tomcat.jar | awk '{print $8;}' | grep -v '/$' | sort | tee pki-tomcat.cmake
      docker exec runner \
          jar tvf /root/src/base/tomcat/target/pki-tomcat.jar | awk '{print $8;}' | grep -v -E '^META-INF/maven/|/$' | sort | tee pki-tomcat.maven
      diff pki-tomcat.cmake pki-tomcat.maven
    displayName: Compare pki-tomcat.jar

  - script: |
      docker exec runner \
          jar tvf /root/build/dist/pki-tomcat-9.0.jar | awk '{print $8;}' | grep -v '/$' | sort | tee pki-tomcat-9.0.cmake
      docker exec runner \
          jar tvf /root/src/base/tomcat-9.0/target/pki-tomcat-9.0.jar | awk '{print $8;}' | grep -v -E '^META-INF/maven/|/$' | sort | tee pki-tomcat-9.0.maven
      diff pki-tomcat-9.0.cmake pki-tomcat-9.0.maven
    displayName: Compare pki-tomcat-9.0.jar

  - script: |
      docker exec runner \
          jar tvf /root/build/dist/pki-server.jar | awk '{print $8;}' | grep -v '/$' | sort | tee pki-server.cmake
      docker exec runner \
          jar tvf /root/src/base/server/target/pki-server.jar | awk '{print $8;}' | grep -v -E '^META-INF/maven/|/$' | sort | tee pki-server.maven
      diff pki-server.cmake pki-server.maven
    displayName: Compare pki-server.jar

  - script: |
      docker exec runner \
          jar tvf /root/build/dist/pki-server-webapp.jar | awk '{print $8;}' | grep -v '/$' | sort | tee pki-server-webapp.cmake
      docker exec runner \
          jar tvf /root/src/base/server-webapp/target/pki-server-webapp.jar | awk '{print $8;}' | grep -v -E '^META-INF/maven/|/$' | sort | tee pki-server-webapp.maven
      diff pki-server-webapp.cmake pki-server-webapp.maven
    displayName: Compare pki-server-webapp.jar

  - script: |
      docker exec runner \
          jar tvf /root/build/dist/pki-ca.jar | awk '{print $8;}' | grep -v '/$' | sort | tee pki-ca.cmake
      docker exec runner \
          jar tvf /root/src/base/ca/target/pki-ca.jar | awk '{print $8;}' | grep -v -E '^META-INF/maven/|/$' | sort | tee pki-ca.maven
      diff pki-ca.cmake pki-ca.maven
    displayName: Compare pki-ca.jar

  - script: |
      docker exec runner \
          jar tvf /root/build/dist/pki-kra.jar | awk '{print $8;}' | grep -v '/$' | sort | tee pki-kra.cmake
      docker exec runner \
